function uniqueToday(){return new Set(todayEvents().filter(e=>e.rating!=='again'&&e.rating!=='wrong').map(e=>e.id)).size;}
function learnedCount(){return db.words.filter(w=>stat(w).seen>0).length;}
function updateProgress(w,rating){const p={...stat(w)};p.seen++;p.last=Date.now();if(['again','wrong'].includes(rating)){p.missed++;p.step=0;p.due=Date.now()+5*60*1000;}else if(rating==='hard'){p.correct++;p.step=Math.max(1,p.step);p.due=Date.now()+HOUR*6;}else{p.correct++;p.step=Math.min(6,p.step+1);p.due=Date.now()+[0,1,3,7,14,30,60][p.step]*DAY;}db.progress[w.id]=p;db.events.push({id:w.id,at:Date.now(),rating});if(db.events.length>7000)db.events=db.events.slice(-5000);save();}
function getWord(id){return db.words.find(w=>w.id===id)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function topbar(title,sub,full=false){return `<header class="hero ${full?'':'minihero'}"><button class="subject-back" data-english-menu="true">← Αγγλικά</button><div><span class="subject-badge">📚 Λέξεις</span></div><div class="eyebrow">ΛΕΞΟΪΣΤΟΡΙΕΣ · VOCABULARY PRACTICE</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></header>`;}
function nav(){let items=[['home','🏠','Σήμερα'],['study','🧠','Κάρτες'],['stories','📖','Ιστορίες'],['test','✍️','Τεστ'],['words','📚','Λέξεις']];return `<nav class="bottom" aria-label="Κύρια πλοήγηση"><div class="bottom-inner">${items.map(([id,icon,title])=>`<button class="navitem ${view===id?'active':''}" data-nav="${id}" aria-label="${title}" ${view===id?'aria-current="page"':''}><span class="ni" aria-hidden="true">${icon}</span>${title}</button>`).join('')}</div></nav>`;}
function warn(){return storageAvailable?'':`<div class="notice">Το πρόγραμμα περιήγησης δεν επιτρέπει την τοπική αποθήκευση. Η πρόοδος ίσως χαθεί. Χρησιμοποίησε «Εξαγωγή αντιγράφου».</div>`;}
function home(){const total=db.words.length, mastered=learnedCount(), due=dueWords().length, day=uniqueToday(), goal=db.goal;return `${topbar('Λίγες λέξεις. Κάθε μέρα.','Μάθε με εικόνες στο μυαλό σου, μικρές ιστορίες και επαναλήψεις.',true)}<main class="main">${warn()}<div class="grid3"><div class="stat"><b>${total}</b><span>Συνολικές λέξεις</span></div><div class="stat"><b>${mastered}</b><span>Έχουν μελετηθεί</span></div><div class="stat"><b>${due}</b><span>Για επανάληψη</span></div></div><div class="card" style="margin-top:14px"><div class="between"><b>Στόχος ημέρας</b><span class="pill">${day} / ${goal} λέξεις</span></div><div class="progress-track"><div class="progress-bar" style="width:${Math.min(100,100*day/goal)}%"></div></div><span class="small">Μετράμε διαφορετικές λέξεις που θυμήθηκες ή εξασκήθηκες.</span></div><div class="feature"><span class="feature-emoji">✨📖</span><h3>Μάθε μέσα από ιστορίες</h3><p>Οι 31 λέξεις του αρχικού σετ είναι οργανωμένες σε 5 μικρές σκηνές. Όλες οι νεότερες λέξεις συμμετέχουν στις κάρτες και στα τεστ.</p><div class="actions"><button class="btn teal" data-nav="stories">Διάβασε ιστορίες</button><button class="btn primary" data-start="daily">Ξεκίνα εξάσκηση</button></div></div><h2 class="section-title">Τι κάνω σήμερα;</h2><div class="card"><div class="between"><div><b>🔁 Επανάληψη</b><div class="small">${due} λέξεις που ήρθε η ώρα τους</div></div><button class="btn sm light" data-start="due" ${due?'':'disabled'}>Ξεκίνα</button></div><hr class="divider"><div class="between"><div><b>🌱 Καινούργιες λέξεις</b><div class="small">${newWords().length} δεν έχεις μελετήσει ακόμη</div></div><button class="btn sm light" data-start="new" ${newWords().length?'':'disabled'}>Μάθε 10</button></div><hr class="divider"><div class="between"><div><b>🎯 Γρήγορο τεστ</b><div class="small">Έλεγξε τι πραγματικά θυμάσαι</div></div><button class="btn sm light" data-nav="test">Πάμε</button></div></div><p class="footer-note">Η πρόοδός σου αποθηκεύεται στη συσκευή και στο πρόγραμμα περιήγησης που χρησιμοποιείς.</p></main>`;}
function createStudySession(ids){return {initialIds:[...ids],progressBefore:clone(db.progress),eventsBefore:clone(db.events),queue:ids.map(id=>({id,retries:0})),total:ids.length,index:0,current:null,revealed:false,answerCount:0,known:0,unknown:0,requeued:0,results:{},hintVisible:false,hintAnswered:false,hintCorrect:null,hintSelected:null,hintChoices:null,hintFor:null};}
function startStudy(kind='daily',ids=null){let arr=[];if(ids){arr=shuffle(ids.map(getWord).filter(Boolean));}else if(kind==='due'){arr=shuffle(dueWords()).slice(0,20);}else if(kind==='new'){arr=shuffle(newWords()).slice(0,10);}else{arr=[...shuffle(dueWords()).slice(0,10),...shuffle(newWords()).slice(0,Math.max(0,10-Math.min(10,dueWords().length)))];}session=createStudySession(arr.map(w=>w.id));advanceStudy();view='study';render();}
function resetStudySession(){if(!session?.initialIds?.length)return;if(!confirm('Να ξεκινήσει ξανά η συνεδρία καρτών από την αρχή; Οι απαντήσεις και η βαθμολογία αυτής της συνεδρίας θα μηδενιστούν.'))return;const ids=[...session.initialIds];db.progress=clone(session.progressBefore);db.events=clone(session.eventsBefore);save();session=createStudySession(ids);advanceStudy();render();showToast('Η συνεδρία ξεκίνησε ξανά από την αρχή.');}
function advanceStudy(){if(!session)return;session.current=session.queue.shift()||null;session.revealed=false;session.hintVisible=false;session.hintAnswered=false;session.hintCorrect=null;session.hintSelected=null;session.hintChoices=null;session.hintFor=null;}
function studyHintChoices(w){if(!session.hintChoices||session.hintFor!==w.id){const distractors=shuffle(db.words.filter(x=>x.id!==w.id)).slice(0,3);session.hintFor=w.id;session.hintChoices=shuffle([w,...distractors]).map(x=>({id:x.id,label:x.el}));}return session.hintChoices;}
function studyHintOptions(w){return `<div class="hint-caption">Διάλεξε τη σωστή ελληνική σημασία:</div>${studyHintChoices(w).map(choice=>{const state=session.revealed?(choice.id===w.id?'correct':choice.id===session.hintSelected?'wrong':''):'';return `<button class="choice ${state}" data-hintanswer="${esc(choice.id)}" ${session.revealed?'disabled':''}>${esc(choice.label)}</button>`;}).join('')}`;}
function studyHintAnswer(id){if(!session?.current||session.revealed)return;const w=getWord(session.current.id);if(!w)return;session.hintVisible=true;session.hintAnswered=true;session.hintSelected=id;session.hintCorrect=id===w.id;session.revealed=true;render();}
function studyPoints(rating,usedHint,hintCorrect){if(rating==='again'||hintCorrect===false)return 0;const base=rating==='easy'?10:7;return Math.max(0,base-(usedHint?3:0));}
function recordStudyResult(w,rating){const usedHint=Boolean(session.hintVisible),hintCorrect=session.hintAnswered?session.hintCorrect:null,points=studyPoints(rating,usedHint,hintCorrect);let result=session.results[w.id];if(!result){result={id:w.id,success:rating!=='again',recovered:false,points,attempts:1,hintsUsed:usedHint?1:0,hintCorrect:hintCorrect===true?1:0,wrongAttempts:rating==='again'?1:0,easy:rating==='easy'?1:0,hard:rating==='hard'?1:0};session.results[w.id]=result;return;}result.attempts++;result.hintsUsed+=usedHint?1:0;result.hintCorrect+=hintCorrect===true?1:0;result.wrongAttempts+=rating==='again'?1:0;result.easy+=rating==='easy'?1:0;result.hard+=rating==='hard'?1:0;if(rating!=='again'){if(!result.success){result.recovered=true;result.points=Math.max(result.points,2);}result.success=true;}}
function studySummary(){const results=Object.values(session?.results||{}),earned=results.reduce((sum,r)=>sum+r.points,0),hints=results.reduce((sum,r)=>sum+r.hintsUsed,0);return {score:session?.total?Math.round(earned/(session.total*10)*100):0,correct:results.filter(r=>r.success).length,wrong:results.filter(r=>!r.success).length,hints,hintCorrect:results.reduce((sum,r)=>sum+r.hintCorrect,0),recovered:results.filter(r=>r.recovered).length,withoutHint:results.filter(r=>r.success&&!r.hintsUsed).length,wrongAttempts:results.reduce((sum,r)=>sum+r.wrongAttempts,0)};}
function studyGrade(score){if(score>=90)return 'Άριστα!';if(score>=75)return 'Πολύ καλά!';if(score>=60)return 'Καλή προσπάθεια!';if(score>=40)return 'Συνέχισε την εξάσκηση';return 'Χρειάζεται ακόμη λίγη εξάσκηση';}
function study(){if(!session){return `${topbar('Κάρτες ανάκλησης','Θυμήσου τη σημασία προτού δεις την απάντηση.')}<main class="main">${warn()}<div class="card"><h2 class="section-title">Διάλεξε εξάσκηση</h2><p class="small">Πρώτα προσπάθησε να θυμηθείς. Έπειτα αποκάλυψε την ελληνική σημασία και αξιολόγησε τον εαυτό σου.</p><div class="vstack" style="margin-top:16px"><button class="btn primary block" data-start="daily">🧠 Μεικτή εξάσκηση (${Math.min(10,dueWords().length+newWords().length)} λέξεις)</button><button class="btn light block" data-start="due" ${dueWords().length?'':'disabled'}>🔁 Μόνο επαναλήψεις (${dueWords().length})</button><button class="btn white block" data-start="new" ${newWords().length?'':'disabled'}>🌱 Μόνο καινούργιες (${newWords().length})</button></div></div><div class="notice">Αν μια λέξη σε δυσκολεύει, θα επιστρέψει ξανά και θα προγραμματιστεί για κοντινή επανάληψη.</div></main>`;}
 if(!session.current){const summary=studySummary();return `${topbar('Αποτελέσματα εξάσκησης','Η βαθμολογία υπολογίζει σωστές απαντήσεις, δυσκολία και χρήση βοήθειας.')}<main class="main"><div class="study-end"><div class="score-ring"><b>${summary.score}</b><span>/ 100</span></div><h2>${studyGrade(summary.score)}</h2><p class="small">Ολοκλήρωσες ${session.total} ${session.total===1?'λέξη':'λέξεις'}.</p></div><div class="grid3" style="margin-top:14px"><div class="stat"><b>${summary.correct}</b><span>Σωστές λέξεις</span></div><div class="stat"><b>${summary.withoutHint}</b><span>Χωρίς βοήθεια</span></div><div class="stat"><b>${summary.wrongAttempts}</b><span>Λάθος προσπάθειες</span></div><div class="stat"><b>${summary.hints}</b><span>Βοήθειες</span></div><div class="stat"><b>${summary.hintCorrect}</b><span>Σωστές βοήθειες</span></div><div class="stat"><b>${summary.recovered}</b><span>Ανακτήσεις</span></div></div><div class="score-note"><b>Πώς βγαίνει ο βαθμός:</b><br>«Το ήξερα» χωρίς βοήθεια: 10 βαθμοί · «Δύσκολο»: 7 · με βοήθεια αφαιρούνται 3 βαθμοί · λάθος απάντηση: 0 · σωστή ανάκτηση μετά από λάθος: 2.</div><div class="vstack"><button class="btn light block" data-reset-study="true">↻ Reset · Ξεκίνα από την αρχή</button><button class="btn primary block" data-start="daily">Νέα εξάσκηση</button><button class="btn white block" data-nav="home">Επιστροφή</button></div></main>`;}
 const w=getWord(session.current.id);if(!w){advanceStudy();return study();} const p=stat(w);const total=Math.max(session.total,1);const done=Math.min(total,session.answerCount-session.requeued);return `${topbar('Κάρτες εξάσκησης','Δοκίμασε να θυμηθείς πριν αποκαλύψεις.')}<main class="main"><div class="between"><span class="pill gray">${p.seen?'Επανάληψη':'Νέα λέξη'}</span><span class="small">${session.answerCount+1} απαντήσεις</span></div><div class="lesson-progress"><span style="width:${Math.min(100,done/total*100)}%"></span></div><div class="card lesson-card" aria-live="polite"><div class="tiny-label">Τι σημαίνει στα ελληνικά;</div>${wordImage(w)}<div class="word">${esc(w.en)}</div><button class="infoicon" data-speak="${esc(w.en)}" title="Άκου προφορά" aria-label="Άκου τη λέξη">🔊</button>${!session.revealed&&!session.hintVisible?`<button class="btn sm light" style="margin-top:13px" data-studyhint="true">🛟 Βοήθεια: δείξε 4 επιλογές</button>`:''}${session.hintVisible?studyHintOptions(w):''}${session.revealed?`<div class="answer">${esc(w.el)}</div>${session.hintAnswered?`<div class="hint-status">${session.hintCorrect?'✓ Σωστή επιλογή με βοήθεια':'✗ Η επιλογή δεν ήταν σωστή'}</div>`:session.hintVisible?'<div class="hint-status">Η βοήθεια χρησιμοποιήθηκε.</div>':''}${w.example?`<div class="example"><div>${highlightExample(w.example,w.en)}</div>${w.exampleGr?`<div class="translation">${esc(w.exampleGr)}</div>`:''}</div>`:''}`:`<div class="word-sub" style="margin-top:16px">Πες δυνατά τη μετάφραση πριν πατήσεις.</div>`}</div>${session.revealed?(session.hintAnswered&&!session.hintCorrect?`<div class="notice" style="margin-top:14px">Η λέξη θα επιστρέψει ξανά σε λίγο.</div><button class="btn primary block" data-rate="again">Συνέχεια →</button>`:`<div class="tiny-label" style="text-align:center;margin-top:15px">Τη θυμήθηκες;</div><div class="rating"><button class="btn bad" data-rate="again">↩ Ξανά</button><button class="btn hard" data-rate="hard">◐ Δύσκολο</button><button class="btn good" data-rate="easy">✓ Το ήξερα</button></div>`):`<button class="btn primary block" data-reveal="true">Δείξε τη σημασία</button>`}<div class="actions" style="margin-top:15px"><button class="btn sm light" data-reset-study="true">↻ Reset συνεδρίας</button><button class="btn sm white" data-close-study="true">Τέλος συνεδρίας</button></div><div class="small" style="text-align:center;margin-top:8px">${session.queue.length} λέξεις ακόμη στην ουρά</div></main>`;}
function highlightExample(str,en){const rx=new RegExp('('+en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|ed|ing|d)?)','ig');const parts=str.split(rx);return parts.map(v=>v.toLowerCase().startsWith(en.toLowerCase())?`<strong>${esc(v)}</strong>`:esc(v)).join('');}
function studyRate(rating){if(!session?.current||!session.revealed)return;const item=session.current,w=getWord(item.id);recordStudyResult(w,rating);updateProgress(w,rating);session.answerCount++;if(rating==='again'){session.unknown++;if(item.retries<1){session.queue.splice(Math.min(2,session.queue.length),0,{...item,retries:item.retries+1});session.requeued++;}}else if(rating==='easy')session.known++;advanceStudy();render();}
function markupStory(str){return esc(str).replace(/\{\{([A-Za-z\-']+)(?::([A-Za-z\-']+))?\}\}/g,(_,display,id)=>`<button class="story-word" data-word="${esc(id||display)}" type="button">${esc(display)}</button>`);}
function stories(){if(storyOpen){const s=db.stories.find(s=>s.id===storyOpen);if(!s){storyOpen=null;return stories();}return `${topbar(s.name,'Άγγιξε τις πράσινες λέξεις για τη σημασία τους.')}<main class="main"><button class="linklike" data-storyback="true">← Όλες οι ιστορίες</button><div class="card">${storyImage(s)}<div style="font-size:48px">${esc(s.emoji||'📖')}</div><div class="story-text">${markupStory(s.en)}</div><div class="actions"><button class="btn light" data-storytranslate="true">${storyTranslated?'Κρύψε':'Δείξε'} μετάφραση</button><button class="btn white" data-speak-story="${esc(s.id)}">🔊 Άκου</button></div>${storyTranslated?`<div class="story-translate" style="margin-top:13px">${esc(s.el)}</div>`:''}<hr class="divider"><div class="between"><b>Λέξεις αυτής της ιστορίας</b><span class="pill gray">${s.ids.filter(getWord).length}</span></div><div class="chiprow" style="flex-wrap:wrap">${s.ids.filter(getWord).map(id=>`<button class="chip" data-word="${esc(id)}">${esc(getWord(id).en)}</button>`).join('')}</div><button class="btn primary block" data-story-study="${esc(s.id)}">🧠 Εξάσκηση αυτών των λέξεων</button></div></main>`;}
 return `${topbar('Ιστορίες που θυμάσαι','Οι λέξεις συνδέονται με εικόνες, συμβάντα και νόημα.')}<main class="main">${warn()}<p class="small" style="margin-top:0">Πρώτα διάβασε κάθε ιστορία. Στη συνέχεια δοκίμασε τις λέξεις της χωρίς να βλέπεις τη μετάφραση.</p>${db.stories.map(s=>`<button class="story-tile" data-story="${esc(s.id)}">${storyImage(s,'story-tile-image')}<div class="story-tile-body"><div class="flex"><div class="emoji">${esc(s.emoji||'📖')}</div><div style="flex:1"><b>${esc(s.name)}</b><div class="caption">${esc(s.desc||'')} · ${s.ids.filter(getWord).length} λέξεις</div></div><span aria-hidden="true" style="font-size:23px;color:#8193a1">›</span></div></div></button>`).join('')}<div class="notice">Οι πρώτες ιστορίες είναι γραμμένες ειδικά για τις λέξεις της φωτογραφίας σου. Νέες λέξεις μπορούν να προστεθούν με ή χωρίς παράδειγμα πρότασης.</div></main>`;}
function candidates(count=10){return [...shuffle(dueWords()),...shuffle(newWords()),...shuffle(db.words.filter(w=>stat(w).seen>0 && stat(w).due>Date.now()))].filter((w,i,a)=>a.findIndex(v=>v.id===w.id)===i).slice(0,count);}
function sentenceMatch(w){const text=String(w?.example||''),base=String(w?.en||'').trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(!text||!base)return null;return text.match(new RegExp(`\\b${base}(?:s|es|ed|ing|d)?\\b`,'i'));}
function sentenceWithBlank(w){const text=String(w?.example||''),match=sentenceMatch(w);if(!match)return '';const start=match.index;return esc(text.slice(0,start))+`<span class="sentence-blank" aria-label="λέξη που λείπει">_____</span>`+esc(text.slice(start+match[0].length));}
function sentenceCandidates(){return candidates(db.words.length).filter(w=>sentenceMatch(w));}
function createQuizSession(ids){return {items:[...ids],initialItems:[...ids],progressBefore:clone(db.progress),eventsBefore:clone(db.events),index:0,correct:0,selected:null,typed:'',marked:false,finished:false};}
function startQuiz(){let items=testMode==='sentences'?sentenceCandidates():candidates(10);items=items.slice(0,10);quiz=createQuizSession(items.map(w=>w.id));render();}
function resetQuizSession(){if(!quiz?.initialItems?.length)return;if(!confirm('Να ξεκινήσει ξανά το τεστ από την πρώτη ερώτηση; Οι απαντήσεις και η βαθμολογία αυτού του τεστ θα μηδενιστούν.'))return;const ids=[...quiz.initialItems];db.progress=clone(quiz.progressBefore);db.events=clone(quiz.eventsBefore);save();quiz=createQuizSession(ids);render();showToast('Το τεστ ξεκίνησε ξανά από την αρχή.');}
function currentQuizWord(){return quiz&&getWord(quiz.items[quiz.index]);}
function quizNext(){if(!quiz)return;quiz.index++;quiz.selected=null;quiz.typed='';quiz.marked=false;if(quiz.index>=quiz.items.length)quiz.finished=true;render();}
function quizAnswer(answer){if(!quiz||quiz.marked)return;const w=currentQuizWord();if(!w)return;const correct=normalize(answer)===normalize(w.en);quiz.selected=answer;quiz.marked=true;if(correct)quiz.correct++;updateProgress(w,correct?'correct':'wrong');render();}
function quizChoices(w){let distractors=shuffle(db.words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.en);if(!quiz._choices||quiz._choiceFor!==w.id){quiz._choiceFor=w.id;quiz._choices=shuffle([w.en,...distractors]);}return quiz._choices;}
function test(){if(!quiz){const sentenceTotal=sentenceCandidates().length,isSentence=testMode==='sentences',available=isSentence?sentenceTotal:db.words.length;return `${topbar('Μικρό τεστ','Προσπάθησε να ανακαλέσεις την αγγλική λέξη.')}<main class="main"><div class="card"><div class="switcher"><button data-testmode="choices" class="${testMode==='choices'?'active':''}">4 επιλογές</button><button data-testmode="sentences" class="${testMode==='sentences'?'active':''}">Σε προτάσεις</button><button data-testmode="typing" class="${testMode==='typing'?'active':''}">Γράψιμο</button></div><h2 class="section-title">${Math.min(10,available)} ερωτήσεις</h2><p class="small">${isSentence?'Θα λείπει μία λέξη από την αγγλική πρόταση. Διάλεξε ποια από τις τέσσερις επιλογές συμπληρώνει σωστά το κενό.':'Θα δεις μια ελληνική σημασία. Διάλεξε ή γράψε την αγγλική λέξη.'} Οι λανθασμένες απαντήσεις μπαίνουν σε πιο σύντομη επανάληψη.</p>${isSentence&&!sentenceTotal?'<div class="notice">Πρόσθεσε παραδείγματα προτάσεων στις λέξεις για να χρησιμοποιήσεις αυτό το τεστ.</div>':''}<button class="btn primary block" data-startquiz="true" ${available?'':'disabled'}>Έναρξη τεστ</button></div></main>`;}
 if(quiz.finished||!currentQuizWord()){return `${topbar('Αποτελέσματα τεστ','Έλεγξες τι θυμάσαι χωρίς βοήθεια.')}<main class="main"><div class="study-end"><div class="medal">🎯</div><div style="font-size:40px;font-weight:850">${quiz.correct} / ${quiz.items.length}</div><p>Σωστές απαντήσεις</p><p class="small">Οι λανθασμένες λέξεις θα επανέλθουν στην εξάσκηση.</p><div class="vstack"><button class="btn light block" data-reset-quiz="true">↻ Reset · Ξεκίνα από την αρχή</button><button class="btn primary block" data-startquiz="true">Νέο τεστ</button><button class="btn white block" data-nav="home">Σήμερα</button></div></div></main>`;}
 const w=currentQuizWord();let feedback='';if(quiz.marked){const correct=normalize(quiz.selected)===normalize(w.en);feedback=`<div class="${correct?'feature':'notice'}" style="margin:13px 0">${correct?'✓ Σωστό!':'✗ Η σωστή λέξη είναι: <b>'+esc(w.en)+'</b>'}${w.example?`<div class="small" style="margin-top:6px">${esc(w.example)}</div>`:''}</div><button class="btn primary block" data-nextquiz="true">${quiz.index+1<quiz.items.length?'Επόμενη ερώτηση →':'Δες αποτέλεσμα'}</button>`;}
 const sentenceMode=testMode==='sentences',choiceMode=testMode!=='typing';return `${topbar('Μικρό τεστ',sentenceMode?'Συμπλήρωσε τη λέξη που λείπει.':testMode==='choices'?'Βρες τη σωστή αγγλική λέξη.':'Πληκτρολόγησε την αγγλική λέξη.')}<main class="main"><div class="between"><span class="pill gray">Ερώτηση ${quiz.index+1} / ${quiz.items.length}</span><span class="small">${quiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${quiz.index/quiz.items.length*100}%"></span></div><div class="card"><div class="tiny-label">${sentenceMode?'Ποια λέξη συμπληρώνει την πρόταση;':'Πώς λέμε στα αγγλικά;'}</div>${sentenceMode?`<div class="sentence-prompt">${sentenceWithBlank(w)}</div>`:`<div class="word" style="font-size:25px;line-height:1.35;margin:20px 0">${esc(w.el)}</div>`}${choiceMode?quizChoices(w).map(ans=>`<button class="choice ${quiz.marked?(ans===w.en?'correct':ans===quiz.selected?'wrong':''):''}" data-answer="${esc(ans)}" ${quiz.marked?'disabled':''}>${esc(ans)}</button>`).join(''):`<div><form id="quizform"><input class="textinput" name="answer" id="typedAnswer" aria-label="Αγγλική λέξη" placeholder="Γράψε την αγγλική λέξη..." autocomplete="off" autocapitalize="none" spellcheck="false" ${quiz.marked?'disabled':''} value="${esc(quiz.typed||'')}"><button class="btn primary block" style="margin-top:12px" ${quiz.marked?'disabled':''} type="submit">Έλεγχος</button></form></div>`}${feedback}</div><div class="actions"><button class="btn sm light" data-reset-quiz="true">↻ Reset συνεδρίας</button><button class="btn sm white" data-stopquiz="true">Τέλος τεστ</button></div></main>`;}
function words(){const match=db.words.filter(w=>{if(wordFilter==='new'&&stat(w).seen!==0)return false;if(wordFilter==='due'&&!(stat(w).seen>0 && stat(w).due<=Date.now()))return false;if(wordFilter==='learned'&&stat(w).seen===0)return false;return (w.en+' '+w.el+' '+w.unit).toLowerCase().includes(searchTerm.toLowerCase());});return `${topbar('Οι λέξεις σου','Αποθήκευσε και εξάσκησε όσες λίστες χρειαστείς.')}<main class="main">${warn()}<div class="actions" style="margin-bottom:14px"><button class="btn primary" data-openimport="true">＋ Προσθήκη λέξεων</button><button class="btn light" data-openbackups="true">⚙ Αντίγραφα</button></div><input id="wordsearch" class="textinput" aria-label="Αναζήτηση λέξης" placeholder="🔎 Αναζήτηση στα αγγλικά ή ελληνικά..." value="${esc(searchTerm)}"><div class="chiprow">${[['all','Όλες'],['new','Νέες'],['due','Επανάληψη'],['learned','Μελετημένες']].map(([id,title])=>`<button class="chip ${wordFilter===id?'active':''}" data-filter="${id}">${title}</button>`).join('')}</div><div class="card"><div class="between"><b>Λεξιλόγιο</b><span class="pill gray">${match.length} / ${db.words.length}</span></div><div id="wordresults">${match.length?match.map(w=>{const p=stat(w);return `<div class="word-row"><div style="min-width:0;flex:1"><div class="wrd">${esc(w.en)}</div><div class="mean">${esc(w.el)}</div></div><div class="right"><span class="pill ${p.seen?'':'gray'}">${p.seen?(p.due<=Date.now()?'επανάληψη':'μελετήθηκε'):'νέα'}</span><button class="linklike" data-word="${esc(w.id)}">Άνοιγμα</button></div></div>`}).join(''):'<p class="small">Δεν υπάρχουν λέξεις με αυτό το φίλτρο.</p>'}</div></div><div class="footer-note">Μπορείς να στείλεις φωτογραφίες με επιπλέον λίστες στη συνομιλία, ώστε να τις μετατρέψω σε έτοιμο κείμενο εισαγωγής.</div></main>`;}
function englishMenu(){const subject=subjectById('english')||englishSubject();return `<header class="subject-head english-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main">${warn()}<div class="card english-intro"><span class="pill">Τρεις ξεχωριστές ενότητες</span><h2 class="section-title" style="margin-top:10px">Τι θέλεις να εξασκήσεις;</h2><p class="small">Οι λέξεις κρατούν την υπάρχουσα πρόοδο, τις εικόνες, τις ιστορίες και τα τεστ σου. Η γραμματική και το Final Test 3 έχουν δική τους θεωρία, εξάσκηση και βαθμολογία.</p></div><div class="subject-grid"><button class="subject-card category-card" data-open-english="vocabulary"><span class="subject-icon">📚</span><span class="subject-card-content"><h3>Λέξεις</h3><p>Κάρτες, ιστορίες, εικόνες και τεστ λεξιλογίου.</p><span class="subject-meta"><span class="pill gray">${db.words.length} λέξεις</span><span class="pill gray">${learnedCount()} μελετημένες</span>${dueWords().length?`<span class="pill warn">${dueWords().length} επαναλήψεις</span>`:''}</span></span><span class="subject-arrow">›</span></button><button class="subject-card category-card" data-open-english="grammar"><span class="subject-icon">✍️</span><span class="subject-card-content"><h3>Γραμματική</h3><p>Would rather / sooner και would prefer.</p><span class="subject-meta"><span class="pill warn">Preference</span><span class="pill gray">12 ερωτήσεις</span>${db.grammar.attempts?`<span class="pill gray">Καλύτερο ${db.grammar.bestScore}/100</span>`:''}</span></span><span class="subject-arrow">›</span></button><button class="subject-card category-card" data-open-english="finaltest"><span class="subject-icon">🎯</span><span class="subject-card-content"><h3>Final Test 3</h3><p>Νέο λεξιλόγιο 37–52 και μεικτή γραμματική.</p><span class="subject-meta"><span class="pill warn">Νέα ενότητα</span><span class="pill gray">20 ερωτήσεις</span>${db.finalTest3.attempts?`<span class="pill gray">Καλύτερο ${db.finalTest3.bestScore}/100</span>`:''}</span></span><span class="subject-arrow">›</span></button></div></main>`;}
function grammarRuleCard(title,form,example,meaning,visualId=''){const visual=grammarVisuals[visualId];return `<section class="card grammar-rule ${visual?'has-image':''}">${visual?`<img class="grammar-rule-image" src="${esc(visual.src)}" alt="${esc(visual.alt)}" loading="lazy"><div class="grammar-image-prompt"><span>👁️</span><span>${esc(visual.prompt)}</span></div>`:''}<h3>${esc(title)}</h3><span class="grammar-form">${esc(form)}</span><div class="grammar-example"><b>${esc(example)}</b><br><span class="small">${esc(meaning)}</span></div></section>`;}
function grammarLessonPage(){return `<div class="card grammar-objectives"><span class="pill gray">Preference</span><h2 class="section-title" style="margin-top:10px">Would rather / sooner · Would prefer</h2><p class="small">Παρατήρησε πρώτα τις εικόνες και μετά τον κανόνα. Έτσι θα ξεχωρίζεις ποιος προτιμά, ποιος ενεργεί και αν μιλάμε για τώρα ή για το παρελθόν.</p></div><div class="grammar-section-title"><span>ΤΩΡΑ / ΜΕΛΛΟΝ</span><h2>Παρόν ή μελλοντική προτίμηση</h2></div>${grammarRuleCard('Would rather / sooner · ίδιο υποκείμενο','subject + would rather/sooner + bare infinitive','I’d rather leave early.','Θα προτιμούσα να φύγω νωρίς.','same-now')}${grammarRuleCard('Would rather / sooner · άλλο υποκείμενο','subject + would rather/sooner + person + past simple','I’d rather Alex took the bus.','Θα προτιμούσα ο Alex να πάρει το λεωφορείο.','other-now')}${grammarRuleCard('Would prefer · ίδιο υποκείμενο','subject + would prefer + (not) to-infinitive','Maya would prefer not to wait.','Η Maya θα προτιμούσε να μην περιμένει.')}${grammarRuleCard('Would prefer · άλλο υποκείμενο','subject + would prefer it if + person + past simple','We’d prefer it if you arrived earlier.','Θα προτιμούσαμε να έφτανες νωρίτερα.')}<div class="grammar-note"><b>Πρόσεξε:</b> το past simple μετά από διαφορετικό υποκείμενο δεν δηλώνει παρελθόν. Δείχνει μια επιθυμητή ή υποθετική αλλαγή στο παρόν/μέλλον.</div><div class="grammar-section-title"><span>ΠΑΡΕΛΘΟΝ</span><h2>Προτίμηση που δεν πραγματοποιήθηκε</h2></div>${grammarRuleCard('Would rather · ίδιο υποκείμενο','subject + would rather + have + past participle','I’d rather have booked earlier.','Θα προτιμούσα να είχα κάνει κράτηση νωρίτερα.','past-regret')}${grammarRuleCard('Would rather · άλλο υποκείμενο','subject + would rather + person + past perfect','I’d rather you had called first.','Θα προτιμούσα να είχες τηλεφωνήσει πρώτα.')}${grammarRuleCard('Would prefer · ίδιο υποκείμενο','subject + would have preferred + to have + past participle','Lena would have preferred to have travelled by train.','Η Lena θα προτιμούσε να είχε ταξιδέψει με τρένο.')}${grammarRuleCard('Would prefer · άλλο υποκείμενο','subject + would have preferred it if + person + past perfect','They would have preferred it if we had stayed.','Θα προτιμούσαν να είχαμε μείνει.')}<div class="grammar-note"><b>Γρήγορο κλειδί:</b> ίδιο πρόσωπο → infinitive. Διαφορετικό πρόσωπο → δικό του υποκείμενο και past simple ή past perfect.</div><button class="btn primary block" data-grammar-start="true">Ξεκίνα την εξάσκηση →</button>`;}
function startGrammarQuiz(){grammarQuiz={items:shuffle(grammarQuestions.map((_,index)=>index)),index:0,correct:0,selected:null,marked:false,finished:false};grammarView='quiz';render();window.scrollTo(0,0);}
function currentGrammarQuestion(){return grammarQuiz?grammarQuestions[grammarQuiz.items[grammarQuiz.index]]:null;}
function answerGrammarQuestion(index){if(!grammarQuiz||grammarQuiz.marked)return;const question=currentGrammarQuestion();grammarQuiz.selected=Number(index);grammarQuiz.marked=true;if(grammarQuiz.selected===question.answer)grammarQuiz.correct++;render();}
function finishGrammarQuiz(){if(!grammarQuiz||grammarQuiz.finished)return;grammarQuiz.finished=true;const score=Math.round(grammarQuiz.correct/grammarQuiz.items.length*100);db.grammar.lastScore=score;db.grammar.bestScore=Math.max(db.grammar.bestScore,score);db.grammar.attempts++;save();render();}
function nextGrammarQuestion(){if(!grammarQuiz)return;if(grammarQuiz.index+1>=grammarQuiz.items.length){finishGrammarQuiz();return;}grammarQuiz.index++;grammarQuiz.selected=null;grammarQuiz.marked=false;render();window.scrollTo(0,0);}
function resetGrammarQuiz(){if(grammarQuiz&&!confirm('Να ξεκινήσει ξανά η εξάσκηση Γραμματικής από την πρώτη ερώτηση;'))return;startGrammarQuiz();showToast('Η εξάσκηση Γραμματικής ξεκίνησε από την αρχή.');}
function grammarQuizImage(question){const visual=grammarVisuals[question.visual];if(!visual)return '';return `<img class="grammar-quiz-image" src="${esc(visual.src)}" alt="${esc(visual.alt)}"><div class="grammar-image-label"><span>🖼️</span><span>Διάβασε τη σκηνή πριν επιλέξεις τον σωστό τύπο.</span></div>`;}
function grammarQuizPage(){if(!grammarQuiz){return `<div class="card grammar-objectives"><span class="pill gray">Εξάσκηση</span><h2 class="section-title" style="margin-top:10px">Τεστ 12 ερωτήσεων</h2><p class="small">Διάλεξε τη σωστή δομή για παρόν, μέλλον ή παρελθόν. Σε τρεις ερωτήσεις η εικόνα σε βοηθά να αναγνωρίσεις το νόημα πριν επιλέξεις τύπο.</p>${db.grammar.attempts?`<div class="grid3" style="margin:16px 0"><div class="stat"><b>${db.grammar.lastScore}</b><span>Τελευταίος βαθμός</span></div><div class="stat"><b>${db.grammar.bestScore}</b><span>Καλύτερος βαθμός</span></div><div class="stat"><b>${db.grammar.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<button class="btn primary block" data-grammar-start="true">Έναρξη εξάσκησης</button></div>`;}if(grammarQuiz.finished){const score=Math.round(grammarQuiz.correct/grammarQuiz.items.length*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${grammarQuiz.correct} σωστές απαντήσεις στις ${grammarQuiz.items.length}.</p><p class="history-score">Καλύτερη επίδοση: ${db.grammar.bestScore}/100 · ${db.grammar.attempts} ${db.grammar.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-grammar-reset="true">↻ Επανάληψη από την αρχή</button><button class="btn primary block" data-grammar-view="lesson">Επανάληψη θεωρίας</button><button class="btn white block" data-english-menu="true">Επιστροφή στα Αγγλικά</button></div>`;}const question=currentGrammarQuestion(),isCorrect=grammarQuiz.selected===question.answer;return `<div class="between"><span class="pill gray">Ερώτηση ${grammarQuiz.index+1} / ${grammarQuiz.items.length}</span><span class="small">${grammarQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${grammarQuiz.index/grammarQuiz.items.length*100}%"></span></div><div class="card">${grammarQuizImage(question)}<div class="tiny-label">Would rather / Would prefer</div><div class="grammar-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${grammarQuiz.marked?(index===question.answer?'correct':index===grammarQuiz.selected?'wrong':''):''}" data-grammar-answer="${index}" ${grammarQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${grammarQuiz.marked?`<div class="grammar-explain"><b>${isCorrect?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-grammar-next="true">${grammarQuiz.index+1<grammarQuiz.items.length?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-grammar-reset="true">↻ Reset εξάσκησης</button>`;}
function grammarModule(){const content=grammarView==='quiz'?grammarQuizPage():grammarLessonPage();return `<header class="subject-head grammar-head"><button class="subject-back" data-english-menu="true">← Αγγλικά</button><div class="subject-head-main"><span class="subject-icon">✍️</span><div><h1>Γραμματική</h1><p>Preference: would rather / sooner και would prefer</p></div></div></header><main class="main"><div class="grammar-tabs"><button data-grammar-view="lesson" class="${grammarView==='lesson'?'active':''}">📖 Θεωρία</button><button data-grammar-view="quiz" class="${grammarView==='quiz'?'active':''}">✅ Εξάσκηση</button></div>${content}</main>`;}
function finalTestMaterialPage(){const total=finalTestGroups.reduce((sum,group)=>sum+group.ids.length,0);return `<section class="card final-intro"><span class="pill warn">Final Test 3</span><h2 class="section-title" style="margin-top:10px">Νέα ενότητα επανάληψης</h2><p class="small">Μελέτησε το λεξιλόγιο των σελίδων 37–43 και τους πέντε γραμματικούς μηχανισμούς που εμφανίζονται στο τεστ. Οι λέξεις έχουν προστεθεί και στις κανονικές κάρτες Αγγλικών.</p><div class="grid3" style="margin-top:15px"><div class="stat"><b>${total}</b><span>λέξεις / φράσεις</span></div><div class="stat"><b>5</b><span>κανόνες</span></div><div class="stat"><b>20</b><span>ερωτήσεις</span></div></div></section><h2 class="section-title">📚 Λεξιλόγιο ενότητας</h2>${finalTestGroups.map(group=>`<section class="card final-word-group"><h3>${esc(group.title)}</h3><div class="final-word-list">${group.ids.map(id=>getWord(id)).filter(Boolean).map(word=>`<div class="final-word-row"><b>${esc(word.en)}</b><span>${esc(word.el)}</span></div>`).join('')}</div></section>`).join('')}<h2 class="section-title">✍️ Grammar focus</h2><div class="final-rules">${finalTestGrammar.map(rule=>`<section class="card final-rule"><b>${esc(rule.title)}</b><code>${esc(rule.form)}</code><p>${esc(rule.text)}</p></section>`).join('')}</div><button class="btn primary block" style="margin-top:16px" data-final-start="true">Ξεκίνα το Final Test 3 →</button>`;}
function startFinalTestQuiz(){finalTestQuiz={index:0,correct:0,selected:null,marked:false,finished:false};finalTestView='quiz';render();window.scrollTo(0,0);}
function currentFinalTestQuestion(){return finalTestQuiz?finalTestQuestions[finalTestQuiz.index]:null;}
function answerFinalTestQuestion(index){if(!finalTestQuiz||finalTestQuiz.marked)return;const question=currentFinalTestQuestion();if(!question)return;finalTestQuiz.selected=Number(index);finalTestQuiz.marked=true;if(finalTestQuiz.selected===question.answer)finalTestQuiz.correct++;render();}
function finishFinalTestQuiz(){if(!finalTestQuiz||finalTestQuiz.finished)return;finalTestQuiz.finished=true;const score=Math.round(finalTestQuiz.correct/finalTestQuestions.length*100);db.finalTest3.lastScore=score;db.finalTest3.bestScore=Math.max(db.finalTest3.bestScore,score);db.finalTest3.attempts++;save();render();window.scrollTo(0,0);}
function nextFinalTestQuestion(){if(!finalTestQuiz)return;if(finalTestQuiz.index+1>=finalTestQuestions.length){finishFinalTestQuiz();return;}finalTestQuiz.index++;finalTestQuiz.selected=null;finalTestQuiz.marked=false;render();window.scrollTo(0,0);}
function resetFinalTestQuiz(){if(finalTestQuiz&&!confirm('Να ξεκινήσει ξανά το Final Test 3 από την πρώτη ερώτηση;'))return;startFinalTestQuiz();showToast('Το Final Test 3 ξεκίνησε από την αρχή.');}
function finalTestQuizPage(){if(!finalTestQuiz)return `<section class="card final-intro"><span class="pill warn">20 ερωτήσεις</span><h2 class="section-title" style="margin-top:10px">Final Test 3</h2><p class="small">Πέντε ερωτήσεις γραμματικής και δεκαπέντε ερωτήσεις λεξιλογίου από το επισυναπτόμενο υλικό. Μετά από κάθε απάντηση εμφανίζεται σύντομη εξήγηση.</p>${db.finalTest3.attempts?`<div class="grid3" style="margin:16px 0"><div class="stat"><b>${db.finalTest3.lastScore}</b><span>Τελευταίος</span></div><div class="stat"><b>${db.finalTest3.bestScore}</b><span>Καλύτερος</span></div><div class="stat"><b>${db.finalTest3.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<button class="btn primary block" data-final-start="true">Έναρξη τεστ</button></section>`;if(finalTestQuiz.finished){const score=Math.round(finalTestQuiz.correct/finalTestQuestions.length*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${finalTestQuiz.correct} σωστές απαντήσεις στις ${finalTestQuestions.length}.</p><p class="final-score-note">Καλύτερη επίδοση: ${db.finalTest3.bestScore}/100 · ${db.finalTest3.attempts} ${db.finalTest3.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-final-reset="true">↻ Επανάληψη από την αρχή</button><button class="btn primary block" data-final-view="material">Μελέτη υλικού</button><button class="btn white block" data-english-menu="true">Επιστροφή στα Αγγλικά</button></div>`;}const question=currentFinalTestQuestion(),isCorrect=finalTestQuiz.selected===question.answer;return `<div class="between"><span class="pill gray">Ερώτηση ${finalTestQuiz.index+1} / ${finalTestQuestions.length}</span><span class="small">${finalTestQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${finalTestQuiz.index/finalTestQuestions.length*100}%"></span></div><div class="card"><div class="tiny-label">${esc(question.tag)} · Final Test 3</div><div class="final-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${finalTestQuiz.marked?(index===question.answer?'correct':index===finalTestQuiz.selected?'wrong':''):''}" data-final-answer="${index}" ${finalTestQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${finalTestQuiz.marked?`<div class="final-explain"><b>${isCorrect?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-final-next="true">${finalTestQuiz.index+1<finalTestQuestions.length?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-final-reset="true">↻ Reset τεστ</button>`;}
function finalTestModule(){const content=finalTestView==='quiz'?finalTestQuizPage():finalTestMaterialPage();return `<header class="subject-head final-head"><button class="subject-back" data-english-menu="true">← Αγγλικά</button><div class="subject-head-main"><span class="subject-icon">🎯</span><div><h1>Final Test 3</h1><p>Λεξιλόγιο 37–52 και στοχευμένη γραμματική</p></div></div></header><main class="main"><div class="final-tabs"><button data-final-view="material" class="${finalTestView==='material'?'active':''}">📖 Υλικό</button><button data-final-view="quiz" class="${finalTestView==='quiz'?'active':''}">✅ Τεστ</button></div>${content}</main>`;}
function focusHistoryMission(){requestAnimationFrame(()=>document.getElementById('history-mission')?.scrollIntoView({behavior:'smooth',block:'start'}));}
function showHistoryScene(index){historySceneIndex=(Number(index)+historyVisuals.length)%historyVisuals.length;historySceneRevealed=false;render();focusHistoryMission();}
function revealHistoryScene(){historySceneRevealed=true;render();focusHistoryMission();}
function hideHistoryScene(){historySceneRevealed=false;render();focusHistoryMission();}
function historyMission(){const item=historyVisuals[historySceneIndex];return `<section class="card history-mission" id="history-mission" data-history-mission="true"><div class="history-mission-top"><img class="history-mission-image" src="${esc(item.src)}" alt="Ιστορική αναπαράσταση για παρατήρηση" loading="eager"><span class="history-mission-counter">Σταθμός ${historySceneIndex+1} / ${historyVisuals.length}</span><div class="history-mission-teaser"><span>ΙΣΤΟΡΙΚΟΣ ΝΤΕΤΕΚΤΙΒ</span><h3>${historySceneRevealed?esc(item.title):'Μπορείς να αναγνωρίσεις τη στιγμή;'}</h3></div></div><div class="history-mission-body"><p class="history-mission-question">${esc(item.mission)}</p><div class="history-observe"><span>👁️</span><span><b>Παρατήρησε:</b> ${esc(item.observe)}</span></div>${historySceneRevealed?`<div class="history-reveal"><div class="history-reveal-title"><span class="history-year">${esc(item.year)}</span><b>${esc(item.title)}</b></div><p>${esc(item.reveal)}</p><p><b>Γιατί έχει σημασία:</b> ${esc(item.impact)}</p><div class="history-clues">${item.clues.map(clue=>`<div class="history-clue"><span>🔎</span><span>${esc(clue)}</span></div>`).join('')}</div></div>`:`<button class="btn teal block" data-history-reveal="true">🔎 Αποκάλυψε το γεγονός</button>`}<div class="history-mission-nav" style="margin-top:12px"><button class="btn light" data-history-scene="${historySceneIndex-1}" aria-label="Προηγούμενος σταθμός">←</button><button class="btn white" ${historySceneRevealed?'data-history-hide="true"':'data-history-reveal="true"'}>${historySceneRevealed?'Κρύψε την απάντηση':'Δώσε μου ένα στοιχείο'}</button><button class="btn light" data-history-scene="${historySceneIndex+1}" aria-label="Επόμενος σταθμός">→</button></div></div></section><div class="history-scene-dots" aria-label="Ιστορικοί σταθμοί">${historyVisuals.map((visual,index)=>`<button class="history-scene-dot ${index===historySceneIndex?'active':''}" data-history-scene="${index}" aria-label="Σταθμός ${index+1}: ${esc(visual.title)}"></button>`).join('')}</div>`;}
function historyLessonPage(){return `<div class="card history-objectives"><span class="pill warn">Σελίδες 30–32</span><h2 class="section-title" style="margin-top:10px">Η εξέλιξη της Ελληνικής Επανάστασης (1821–1827)</h2><p class="small">Μην αποστηθίσεις απλώς χρονολογίες. Μπες στις σκηνές, ψάξε τα στοιχεία και ανακάλυψε πώς μια επιτυχία, μια κρίση και μια διεθνής απόφαση άλλαξαν την πορεία του Αγώνα.</p></div><h2 class="section-title">🎯 Αποστολή: Γίνε ιστορικός ντετέκτιβ</h2><p class="small" style="margin-top:-7px">Παρατήρησε πρώτα την εικόνα και κάνε τη δική σου υπόθεση. Μετά πάτησε την αποκάλυψη.</p>${historyMission()}<div class="notice">Οι εικόνες είναι σύγχρονες ψηφιακές ιστορικές αναπαραστάσεις για εκπαιδευτική χρήση και όχι αυθεντικές φωτογραφίες της εποχής.</div><h2 class="section-title">Σύνδεσε τα γεγονότα</h2><div class="timeline">${historyTimeline.map(item=>`<div class="timeline-item"><div class="timeline-year">${esc(item.year)}</div><div class="timeline-line"></div><div class="timeline-copy"><b>${esc(item.title)}</b><span>${esc(item.text)}</span></div></div>`).join('')}</div><h2 class="section-title">Η μεγάλη εικόνα σε 4 κεφάλαια</h2>${historySections.map(section=>`<section class="card history-section"><h3>${esc(section.title)}</h3><p>${esc(section.text)}</p></section>`).join('')}<div class="notice">Το κείμενο αποτελεί εκπαιδευτική σύνοψη των τριών σελίδων και όχι αυτούσια αντιγραφή του σχολικού βιβλίου.</div><button class="btn primary block" data-history-view="quiz">Δοκίμασε τι ανακάλυψες →</button>`;}
function historyQuizPool(mode){return mode==='detail'?historyDetailedQuestions:historyQuestions;}
function startHistoryQuiz(mode='core'){historyQuiz={mode,questions:historyQuizPool(mode),index:0,correct:0,selected:null,marked:false,finished:false};historyView='quiz';render();window.scrollTo(0,0);}
function historyMatchingTotal(){return historyMatchingSets.reduce((total,set)=>total+set.pairs.length,0);}
function startHistoryMatching(){historyQuiz={mode:'matching',setIndex:0,selections:{},checked:false,setCorrect:0,correct:0,finished:false};historyView='quiz';render();window.scrollTo(0,0);}
function currentHistoryQuestion(){return historyQuiz?.questions?.[historyQuiz.index]||null;}
function answerHistoryQuestion(index){if(!historyQuiz||historyQuiz.marked)return;const question=currentHistoryQuestion();if(!question)return;historyQuiz.selected=Number(index);historyQuiz.marked=true;if(historyQuiz.selected===question.answer)historyQuiz.correct++;render();}
function finishHistoryQuiz(){if(!historyQuiz||historyQuiz.finished)return;historyQuiz.finished=true;const score=Math.round(historyQuiz.correct/historyQuiz.questions.length*100);db.history.lastScore=score;db.history.bestScore=Math.max(db.history.bestScore,score);db.history.attempts++;save();render();}
function nextHistoryQuestion(){if(!historyQuiz)return;if(historyQuiz.index+1>=historyQuiz.questions.length){finishHistoryQuiz();return;}historyQuiz.index++;historyQuiz.selected=null;historyQuiz.marked=false;render();window.scrollTo(0,0);}
function resetHistoryQuiz(){const mode=historyQuiz?.mode||'core';if(historyQuiz&&!confirm('Να ξεκινήσει ξανά η εξάσκηση Ιστορίας από την αρχή;'))return;if(mode==='matching'){startHistoryMatching();showToast('Η αντιστοίχιση ξεκίνησε από την αρχή.');return;}startHistoryQuiz(mode);showToast('Το τεστ Ιστορίας ξεκίνησε από την αρχή.');}
function historyQuizImage(question){if(!Number.isInteger(question.visual)||!historyVisuals[question.visual])return '';const visual=historyVisuals[question.visual];return `<img class="history-quiz-image" src="${esc(visual.src)}" alt="Ιστορική αναπαράσταση: ${esc(visual.title)}"><div class="history-image-label"><span>🖼️</span><span>Χρησιμοποίησε και την εικόνα ως στοιχείο.</span></div>`;}
function historyMatchingOptions(set){const answers=set.pairs.map(pair=>pair.right),shift=(historyQuiz.setIndex+2)%answers.length;return answers.slice(shift).concat(answers.slice(0,shift));}
function captureHistoryMatching(){if(historyQuiz?.mode!=='matching'||historyQuiz.checked)return;document.querySelectorAll('[data-history-match]').forEach(field=>{historyQuiz.selections[field.dataset.historyMatch]=field.value;});}
function checkHistoryMatching(){if(historyQuiz?.mode!=='matching'||historyQuiz.checked)return;captureHistoryMatching();const set=historyMatchingSets[historyQuiz.setIndex];historyQuiz.setCorrect=set.pairs.filter((pair,index)=>historyQuiz.selections[index]===pair.right).length;historyQuiz.correct+=historyQuiz.setCorrect;historyQuiz.checked=true;render();}
function finishHistoryMatching(){if(historyQuiz?.mode!=='matching'||historyQuiz.finished)return;historyQuiz.finished=true;const score=Math.round(historyQuiz.correct/historyMatchingTotal()*100);db.history.lastScore=score;db.history.bestScore=Math.max(db.history.bestScore,score);db.history.attempts++;save();render();window.scrollTo(0,0);}
function nextHistoryMatching(){if(historyQuiz?.mode!=='matching'||!historyQuiz.checked)return;if(historyQuiz.setIndex+1>=historyMatchingSets.length){finishHistoryMatching();return;}historyQuiz.setIndex++;historyQuiz.selections={};historyQuiz.checked=false;historyQuiz.setCorrect=0;render();window.scrollTo(0,0);}
function historyMatchingPage(){const total=historyMatchingTotal();if(historyQuiz.finished){const score=Math.round(historyQuiz.correct/total*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${historyQuiz.correct} σωστές αντιστοιχίσεις στις ${total}.</p><p class="history-score">Καλύτερη επίδοση: ${db.history.bestScore}/100 · ${db.history.attempts} ${db.history.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-history-reset="true">↻ Επανάληψη αντιστοίχισης</button><button class="btn white block" data-history-view="quiz">Διάλεξε άλλη εξάσκηση</button><button class="btn primary block" data-history-view="critical">Ασκήσεις κριτικής σκέψης</button><button class="btn white block" data-history-view="lesson">Επιστροφή στο μάθημα</button></div>`;}const set=historyMatchingSets[historyQuiz.setIndex],options=historyMatchingOptions(set);return `<div class="between"><span class="pill gray">Γύρος ${historyQuiz.setIndex+1} / ${historyMatchingSets.length}</span><span class="small">${historyQuiz.correct} σωστές συνολικά</span></div><div class="lesson-progress"><span style="width:${historyQuiz.setIndex/historyMatchingSets.length*100}%"></span></div><div class="card"><div class="history-detail-label">🧩 Αντιστοίχιση</div><h2 class="section-title" style="margin-top:5px">${esc(set.title)}</h2><p class="history-match-intro">${esc(set.prompt)} Άνοιξε κάθε λίστα και διάλεξε τη σωστή απάντηση.</p>${set.pairs.map((pair,index)=>{const selected=historyQuiz.selections[index]||'',isCorrect=selected===pair.right,rowClass=historyQuiz.checked?(isCorrect?'correct':'wrong'):'';return `<div class="history-match-row ${rowClass}"><div class="history-match-left"><span class="history-match-number">${index+1}</span><span>${esc(pair.left)}</span></div><select class="history-match-select" data-history-match="${index}" ${historyQuiz.checked?'disabled':''}><option value="">— Διάλεξε αντιστοίχιση —</option>${options.map(option=>`<option value="${esc(option)}" ${selected===option?'selected':''}>${esc(option)}</option>`).join('')}</select>${historyQuiz.checked?`<p class="history-match-answer ${isCorrect?'correct':''}">${isCorrect?'✓ Σωστά':'✗ Σωστή απάντηση: '+esc(pair.right)}</p>`:''}</div>`;}).join('')}${historyQuiz.checked?`<div class="history-match-status"><b>${historyQuiz.setCorrect} / ${set.pairs.length} σωστές</b><span class="small">Δες τις διορθώσεις πριν συνεχίσεις.</span></div><button class="btn primary block" data-history-match-next="true">${historyQuiz.setIndex+1<historyMatchingSets.length?'Επόμενος γύρος →':'Δες τη βαθμολογία'}</button>`:'<button class="btn teal block" style="margin-top:14px" data-history-match-check="true">Έλεγχος αντιστοίχισης</button>'}</div><button class="btn light block" data-history-reset="true">↻ Reset αντιστοίχισης</button>`;}
function historyQuizPage(){
 if(historyQuiz?.mode==='matching')return historyMatchingPage();
 if(!historyQuiz){return `<div class="card history-objectives"><span class="pill warn">Τρεις τρόποι εξάσκησης</span><h2 class="section-title" style="margin-top:10px">Διάλεξε εξάσκηση Ιστορίας</h2><p class="small">Ξεκίνα με τη βασική κατανόηση, προχώρησε στις λεπτομέρειες ή σύνδεσε πρόσωπα, ημερομηνίες, γεγονότα και τόπους.</p><div class="history-mode-grid"><button class="history-mode-card" data-history-start="core"><span class="history-mode-icon">🎯</span><span class="history-mode-copy"><b>Βασική κατανόηση</b><span>Μεγάλη εικόνα, αιτίες και αποτελέσματα.</span></span><span class="history-mode-count">${historyQuestions.length} ερωτήσεις</span></button><button class="history-mode-card detail" data-history-start="detail"><span class="history-mode-icon">🔎</span><span class="history-mode-copy"><b>Αναλυτικό τεστ</b><span>Λεπτομέρειες από τις νέες χειρόγραφες σημειώσεις.</span></span><span class="history-mode-count">${historyDetailedQuestions.length} ερωτήσεις</span></button><button class="history-mode-card matching" data-history-match-start="true"><span class="history-mode-icon">🧩</span><span class="history-mode-copy"><b>Αντιστοίχιση</b><span>Πρόσωπα, ημερομηνίες, γεγονότα και τόποι.</span></span><span class="history-mode-count">${historyMatchingTotal()} ζεύγη</span></button></div>${db.history.attempts?`<div class="grid3" style="margin:16px 0 0"><div class="stat"><b>${db.history.lastScore}</b><span>Τελευταίος βαθμός</span></div><div class="stat"><b>${db.history.bestScore}</b><span>Καλύτερος βαθμός</span></div><div class="stat"><b>${db.history.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<p class="essay-source-note">Οι αναλυτικές ερωτήσεις και οι αντιστοιχίσεις βασίζονται στις φωτογραφίες των σημειώσεων και στην Ενότητα 8 του σχολικού βιβλίου Ιστορίας Γ΄ Γυμνασίου.</p></div>`;}
 const total=historyQuiz.questions.length,modeLabel=historyQuiz.mode==='detail'?'Αναλυτικό τεστ':'Βασική κατανόηση';
 if(historyQuiz.finished){const score=Math.round(historyQuiz.correct/total*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${historyQuiz.correct} σωστές απαντήσεις στις ${total} · ${modeLabel}.</p><p class="history-score">Καλύτερη επίδοση: ${db.history.bestScore}/100 · ${db.history.attempts} ${db.history.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-history-reset="true">↻ Επανάληψη του ίδιου τεστ</button><button class="btn white block" data-history-view="quiz">Διάλεξε άλλο επίπεδο</button><button class="btn primary block" data-history-view="critical">Ασκήσεις κριτικής σκέψης</button><button class="btn white block" data-history-view="lesson">Επιστροφή στο μάθημα</button></div>`;}
 const question=currentHistoryQuestion(),isCorrect=historyQuiz.selected===question.answer;
 return `<div class="between"><span class="pill gray">Ερώτηση ${historyQuiz.index+1} / ${total}</span><span class="small">${historyQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${historyQuiz.index/total*100}%"></span></div><div class="card">${historyQuizImage(question)}${historyQuiz.mode==='detail'?'<div class="history-detail-label">🔎 Λεπτομέρεια σημειώσεων</div>':'<div class="tiny-label">Κατανόηση και αιτιολόγηση</div>'}<div class="history-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${historyQuiz.marked?(index===question.answer?'correct':index===historyQuiz.selected?'wrong':''):''}" data-history-answer="${index}" ${historyQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${historyQuiz.marked?`<div class="history-explain"><b>${isCorrect?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-history-next="true">${historyQuiz.index+1<total?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-history-reset="true">↻ Reset τεστ</button>`;
}
function captureHistoryResponses(){document.querySelectorAll('[data-history-response]').forEach(field=>{db.history.responses[field.dataset.historyResponse]=field.value.trim();});}

="rubric-item">✓ <span>Ξεχωρίζω το τεκμήριο από την προσωπική μου υπόθεση.</span></div></div></div>`;}
function historyModule(){const subject=subjectById('history')||historySubject(),content=historyView==='quiz'?historyQuizPage():historyView==='critical'?historyCriticalPage():historyLessonPage();return `<header class="subject-head history-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main"><div class="history-tabs"><button data-history-view="lesson" class="${historyView==='lesson'?'active':''}">📖 Μάθημα</button><button data-history-view="quiz" class="${historyView==='quiz'?'active':''}">✅ Κατανόηση</button><button data-history-view="critical" class="${historyView==='critical'?'active':''}">💭 Κριτική</button></div>${content}</main>`;}
function currentEssayTopic(){return essayTopics.find(topic=>topic.id===db.essay.topicId)||essayTopics[0];}
function essayTopicAxes(topic=currentEssayTopic()){return topic.axisIds.map(id=>essayAxes.find(axis=>axis.id===id)).filter(Boolean);}
function essayAxis(id){return essayAxes.find(axis=>axis.id===id);}
function currentEssayPlan(){return db.essay.plans[currentEssayTopic().id]||{};}
function essayValue(field){return String(currentEssayPlan()[field]||'');}
function essaySelectedAxis(index){const topic=currentEssayTopic(),saved=essayValue(`body${index}Theme`);return essayAxis(saved)&&topic.axisIds.includes(saved)?saved:topic.axisIds[index-1]||topic.axisIds[0];}
function captureEssayPlan(){const plan={...currentEssayPlan()};document.querySelectorAll('[data-essay-field]').forEach(field=>{plan[field.dataset.essayField]=field.value.trim();});db.essay.plans[currentEssayTopic().id]=plan;}
function saveEssayPlan(){captureEssayPlan();save();render();showToast('Το σχεδιάγραμμα αποθηκεύτηκε.');}
function chooseEssayTopic(id){if(!essayTopics.some(topic=>topic.id===id))return;if(essayView==='plan')captureEssayPlan();db.essay.topicId=id;save();render();window.scrollTo(0,0);}
function essayTextarea(field,label,help,placeholder,rows=3){return `<label class="inputlabel" for="essay-${esc(field)}">${esc(label)}</label>${help?`<div class="essay-field-help">${esc(help)}</div>`:''}<textarea id="essay-${esc(field)}" class="textarea" rows="${rows}" data-essay-field="${esc(field)}" placeholder="${esc(placeholder)}">${esc(essayValue(field))}</textarea>`;}
function essayAxisOptions(selected){return essayTopicAxes().map(axis=>`<option value="${esc(axis.id)}" ${axis.id===selected?'selected':''}>${esc(axis.title)}</option>`).join('');}
function essayThemesPage(){const topic=currentEssayTopic();return `<div class="card essay-intro"><span class="pill">Στρατηγική γραφής</span><h2 class="section-title" style="margin-top:10px">Πρώτα σχεδιάζω, μετά γράφω</h2><p class="small">Το υλικό των φωτογραφιών γίνεται τράπεζα ιδεών. Δεν χρειάζεται να χρησιμοποιηθούν όλα: για ένα κείμενο ${esc(topic.goal)} επιλέγουμε συνήθως τρεις διαφορετικούς άξονες και τους συνδέουμε λογικά.</p><div class="essay-cycle"><div class="essay-cycle-step">1<b>Μοντέλο</b>Βλέπω τη δομή</div><div class="essay-cycle-step">2<b>Πράξη</b>Στήνω σκελετό</div><div class="essay-cycle-step">3<b>Έλεγχος</b>Βελτιώνω</div></div></div><h2 class="section-title">Διάλεξε θέμα</h2>${essayTopics.map(item=>`<button class="essay-topic ${item.id===topic.id?'active':''}" data-essay-topic="${esc(item.id)}"><h3>${esc(item.title)}</h3><p>${esc(item.prompt)}</p><div class="subject-meta"><span class="pill gray">${esc(item.goal)}</span><span class="pill gray">${item.axisIds.length} θεματικοί άξονες</span></div></button>`).join('')}<h2 class="section-title" style="margin-top:20px">Τράπεζα θεματικών ενοτήτων</h2><div class="essay-axis-grid">${essayTopicAxes(topic).map((axis,index)=>`<article class="essay-axis"><span class="pill gray">${String(index+1).padStart(2,'0')}</span><h3>${esc(axis.title)}</h3><p>${esc(axis.idea)}</p><div class="essay-question"><b>Ρώτησε:</b> ${esc(axis.question)}</div><div class="essay-keywords">${axis.keywords.map(word=>`<span class="essay-keyword">${esc(word)}</span>`).join('')}</div></article>`).join('')}</div><p class="essay-source-note">Οι άξονες οργανώθηκαν από το υλικό που ανέβασες: αξία της γλώσσας, άτομο, κοινωνία, σύγχρονες προκλήσεις, γλωσσικό πρόβλημα και γλωσσομάθεια.</p><button class="btn primary block" style="margin-top:16px" data-essay-view="plan">Στήσε το σχεδιάγραμμα →</button>`;}
function essayParagraphPlanner(index){const selected=essaySelectedAxis(index),axis=essayAxis(selected);return `<div class="essay-paragraph"><h4>Παράγραφος ${index}</h4><label class="inputlabel" for="essay-body${index}Theme">Θεματική ενότητα</label><select id="essay-body${index}Theme" class="textinput" data-essay-field="body${index}Theme" data-essay-axis="true">${essayAxisOptions(selected)}</select><div class="essay-question"><b>Κεντρική ερώτηση:</b> ${esc(axis?.question||'')}</div>${essayTextarea(`body${index}Claim`,'Θεματική περίοδος','Μία καθαρή πρόταση που απαντά στην κεντρική ερώτηση.','Η γλώσσα...')}${essayTextarea(`body${index}Support`,'Ανάπτυξη – αιτιολόγηση','Εξήγησε πώς ή γιατί ισχύει η θέση σου.','Αυτό συμβαίνει επειδή...')}${essayTextarea(`body${index}Example`,'Τεκμήριο ή παράδειγμα','Χρησιμοποίησε παράδειγμα, συνέπεια, σύγκριση ή σύντομο τεκμήριο.','Για παράδειγμα...')}${essayTextarea(`body${index}Link`,'Κατακλείδα – σύνδεση','Κλείσε την ιδέα και οδήγησε ομαλά στην επόμενη.','Επομένως...')}</div>`;}
function essayPlanPage(){const fields=['interpretation','purpose','thesis','introOpening','introContext','body1Claim','body1Support','body1Example','body1Link','body2Claim','body2Support','body2Example','body2Link','body3Claim','body3Support','body3Example','body3Link','conclusionSynthesis','conclusionFinal'],done=fields.filter(field=>essayValue(field)).length,topic=currentEssayTopic();return `<div class="card essay-intro"><span class="pill warn">${esc(topic.goal)}</span><h2 class="section-title" style="margin-top:10px">${esc(topic.title)}</h2><p class="small">${esc(topic.prompt)}</p><div class="progress-track"><div class="progress-bar" style="width:${done/fields.length*100}%"></div></div><div class="essay-progress-label">${done} / ${fields.length} στοιχεία σχεδιασμένα</div></div><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">1</div><div><h3>Κατανόησε την εκφώνηση</h3><span>Θέμα · σκοπός · κεντρική θέση</span></div></div>${essayTextarea('interpretation','Τι ακριβώς μου ζητά;','Ξαναγράψε την εκφώνηση με δικά σου λόγια.','Πρέπει να εξηγήσω...')}${essayTextarea('purpose','Σε ποιον γράφω και με ποιον σκοπό;','Σκέψου αναγνώστη, είδος κειμένου και επιδιωκόμενο αποτέλεσμα.','Απευθύνομαι σε... και θέλω να...')}${essayTextarea('thesis','Κεντρική θέση','Μία πρόταση που θα αποδεικνύει ολόκληρο το κείμενο.','Υποστηρίζω ότι...')}</section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">2</div><div><h3>Στήσε το κύριο μέρος</h3><span>Τρεις διαφορετικοί άξονες · μία ιδέα ανά παράγραφο</span></div></div><div class="essay-question"><b>Κανόνας:</b> Θεματική περίοδος → αιτιολόγηση → παράδειγμα/τεκμήριο → κατακλείδα.</div>${[1,2,3].map(essayParagraphPlanner).join('')}</section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">3</div><div><h3>Σχεδίασε τον πρόλογο</h3><span>Άνοιγμα · πλαίσιο · μετάβαση στη θέση</span></div></div>${essayTextarea('introOpening','Πώς θα ανοίξεις το θέμα;','Επίλεξε σύντομο ορισμό, διαπίστωση, αντίθεση ή ερώτημα.','Στη σύγχρονη εποχή...')}${essayTextarea('introContext','Πώς θα το συνδέσεις με την εκφώνηση;','Δώσε μόνο το αναγκαίο πλαίσιο· μην αναπτύξεις ακόμη τα επιχειρήματα.','Η σημασία του ζητήματος γίνεται φανερή...')}<div class="essay-question"><b>Η θέση σου:</b> ${esc(essayValue('thesis')||'Συμπλήρωσέ την στο Βήμα 1.')}</div></section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">4</div><div><h3>Σχεδίασε τον επίλογο</h3><span>Σύνθεση · τελική προοπτική</span></div></div>${essayTextarea('conclusionSynthesis','Τι συμπέρασμα προκύπτει;','Σύνθεσε τις τρεις ιδέες χωρίς μηχανική επανάληψη.','Συνολικά, γίνεται φανερό ότι...')}${essayTextarea('conclusionFinal','Με ποια σκέψη θα κλείσεις;','Πρόταση, προοπτική, προϋπόθεση ή σύντομη παρότρυνση.','Το ζητούμενο, λοιπόν, είναι...')}</section><div class="vstack"><button class="btn primary block" data-essay-save="true">💾 Αποθήκευση σχεδιαγράμματος</button><button class="btn teal block" data-essay-view="review">Έλεγχος της δομής →</button><button class="btn light block" data-essay-reset="true">↻ Καθαρισμός αυτού του σχεδιαγράμματος</button></div>`;}
function essayOutlineLine(label,value){return `<div class="essay-outline-line"><b>${esc(label)}:</b> ${value?esc(value):'<span class="essay-empty-line">Δεν έχει συμπληρωθεί ακόμη</span>'}</div>`;}
function essayReviewPage(){const plan=currentEssayPlan(),topic=currentEssayTopic(),themes=[1,2,3].map(index=>essaySelectedAxis(index)),uniqueThemes=new Set(themes).size===3,paragraphsComplete=[1,2,3].every(index=>plan[`body${index}Claim`]&&plan[`body${index}Support`]&&plan[`body${index}Example`]),checks=[['Η θέση απαντά στην εκφώνηση',!!plan.thesis],['Οι τρεις παράγραφοι έχουν διαφορετικές θεματικές',uniqueThemes],['Κάθε παράγραφος έχει θέση, εξήγηση και παράδειγμα',paragraphsComplete],['Ο πρόλογος οδηγεί φυσικά στην κεντρική θέση',!!plan.introOpening&&!!plan.introContext&&!!plan.thesis],['Ο επίλογος συνθέτει και δεν επαναλαμβάνει μηχανικά',!!plan.conclusionSynthesis&&!!plan.conclusionFinal]];return `<div class="card essay-intro"><span class="pill">Χάρτης πριν από τη συγγραφή</span><h2 class="section-title" style="margin-top:10px">${esc(topic.title)}</h2><p class="small">Διάβασε μόνο τον σκελετό. Αν η πορεία των ιδεών είναι καθαρή χωρίς πλήρεις παραγράφους, μπορείς να αρχίσεις το πρώτο προσχέδιο.</p></div><section class="card essay-outline"><h3>Πρόλογος</h3>${essayOutlineLine('Άνοιγμα',plan.introOpening)}${essayOutlineLine('Πλαίσιο',plan.introContext)}${essayOutlineLine('Κεντρική θέση',plan.thesis)}</section>${[1,2,3].map(index=>{const axis=essayAxis(essaySelectedAxis(index));return `<section class="card essay-outline"><span class="pill gray">Κύριο μέρος · ${index}</span><h3>${esc(axis?.title||'Θεματική ενότητα')}</h3>${essayOutlineLine('Θεματική περίοδος',plan[`body${index}Claim`])}${essayOutlineLine('Αιτιολόγηση',plan[`body${index}Support`])}${essayOutlineLine('Παράδειγμα',plan[`body${index}Example`])}${essayOutlineLine('Κατακλείδα',plan[`body${index}Link`])}</section>`;}).join('')}<section class="card essay-outline"><h3>Επίλογος</h3>${essayOutlineLine('Σύνθεση',plan.conclusionSynthesis)}${essayOutlineLine('Τελική σκέψη',plan.conclusionFinal)}</section><div class="card"><h3 style="margin-top:0">Αυτοέλεγχος πριν από το πρώτο προσχέδιο</h3>${checks.map(([label,ok])=>`<div class="essay-check ${ok?'done':'todo'}"><span>${ok?'✓':'○'}</span><span>${esc(label)}</span></div>`).join('')}</div><div class="vstack"><button class="btn primary block" data-essay-view="plan">← Βελτίωσε το σχεδιάγραμμα</button><button class="btn white block" data-essay-export="true">⬇ Εξαγωγή σχεδιαγράμματος</button></div>`;}
function resetEssayPlan(){if(!confirm('Να καθαριστεί το σχεδιάγραμμα για αυτό το θέμα;'))return;db.essay.plans[currentEssayTopic().id]={};save();render();showToast('Το σχεδιάγραμμα καθαρίστηκε.');}
function exportEssayPlan(){captureEssayPlan();save();const plan=currentEssayPlan(),topic=currentEssayTopic(),lines=[topic.title,topic.prompt,'',`ΚΕΝΤΡΙΚΗ ΘΕΣΗ: ${plan.thesis||''}`,'',`ΠΡΟΛΟΓΟΣ\n${plan.introOpening||''}\n${plan.introContext||''}`];for(let index=1;index<=3;index++){const axis=essayAxis(essaySelectedAxis(index));lines.push('',`ΠΑΡΑΓΡΑΦΟΣ ${index}: ${axis?.title||''}`,plan[`body${index}Claim`]||'',plan[`body${index}Support`]||'',plan[`body${index}Example`]||'',plan[`body${index}Link`]||'');}lines.push('',`ΕΠΙΛΟΓΟΣ\n${plan.conclusionSynthesis||''}\n${plan.conclusionFinal||''}`);exportFile(`sxediagramma-${topic.id}.txt`,lines.join('\n'),'text/plain;charset=utf-8');}
function essayModule(){const subject=subjectById('essay')||essaySubject(),content=essayView==='plan'?essayPlanPage():essayView==='review'?essayReviewPage():essayThemesPage();return `<header class="subject-head essay-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main"><div class="essay-tabs"><button data-essay-view="themes" class="${essayView==='themes'?'active':''}">💡 Θεματικές</button><button data-essay-view="plan" class="${essayView==='plan'?'active':''}">🧩 Σχεδιάγραμμα</button><button data-essay-view="review" class="${essayView==='review'?'active':''}">✓ Έλεγχος</button></div>${content}</main>`;}
