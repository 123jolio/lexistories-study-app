function migrateData(value){const data={...defaultData(),...(value||{}),version:7};data.subjects=(Array.isArray(data.subjects)?data.subjects:[]).filter(subject=>subject&&typeof subject.id==='string'&&typeof subject.name==='string').map(subject=>({...subject,emoji:String(subject.emoji||'📘'),description:subject.id==='english'?englishSubject().description:subject.id==='history'?historySubject().description:subject.id==='essay'?essaySubject().description:String(subject.description||''),type:subject.id==='english'?'english':subject.id==='history'?'history':subject.id==='essay'?'essay':'generic',units:Array.isArray(subject.units)?subject.units.filter(unit=>unit&&typeof unit.title==='string').map(unit=>({...unit,id:String(unit.id||'unit-'+Date.now()),content:String(unit.content||'')})):[]}));if(!data.subjects.some(subject=>subject.id==='english'))data.subjects.unshift(englishSubject());if(!data.subjects.some(subject=>subject.id==='history')){const englishIndex=data.subjects.findIndex(subject=>subject.id==='english');data.subjects.splice(englishIndex+1,0,historySubject());}if(!data.subjects.some(subject=>subject.id==='essay')){const historyIndex=data.subjects.findIndex(subject=>subject.id==='history');data.subjects.splice(historyIndex+1,0,essaySubject());}data.words=Array.isArray(data.words)?data.words:[];const existingWords=new Set(data.words.map(word=>normalize(word?.en||word?.id)));for(const word of initialWords){const key=normalize(word.en);if(!existingWords.has(key)){data.words.push(clone(word));existingWords.add(key);}}data.events=Array.isArray(data.events)?data.events:[];data.goal=Number(data.goal)||10;data.grammar={bestScore:Number(data.grammar?.bestScore)||0,lastScore:Number.isFinite(data.grammar?.lastScore)?Number(data.grammar.lastScore):null,attempts:Number(data.grammar?.attempts)||0};data.history={bestScore:Number(data.history?.bestScore)||0,lastScore:Number.isFinite(data.history?.lastScore)?Number(data.history.lastScore):null,attempts:Number(data.history?.attem function updateProgress(w,rating){const p={...stat(w)};p.seen++;p.last=Date.now();if(['again','wrong'].includes(rating)){p.missed++;p.step=0;p.due=Date.now()+5*60*1000;}else if(rating==='hard'){p.correct++;p.step=Math.max(1,p.step);p.due=Date.now()+HOUR*6;}else{p.correct++;p.step=Math.min(6,p.step+1);p.due=Date.now()+[0,1,3,7,14,30,60][p.step]*DAY;}db.progress[w.id]=p;db.events.push({id:w.id,at:Date.now(),rating});if(db.events.length>7000)db.events=db.events.slice(-5000);save();}

function studyPoints(rating,usedHint,hintCorrect){if(rating==='again'||hintCorrect===false)return 0;const base=rating==='easy'?10:7;return Math.max(0,base-(usedHint?3:0));}

function candidates(count=10){return [...shuffle(dueWords()),...shuffle(newWords()),...shuffle(db.words.filter(w=>stat(w).seen>0 && stat(w).due>Date.now()))].filter((w,i,a)=>a.findIndex(v=>v.id===w.id)===i).slice(0,count);}
function sentenceMatch(w){const text=String(w?.example||''),base=String(w?.en||'').trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(!text||!base)return null;return text.match(new RegExp(`\\b${base}(?:s|es|ed|ing|d)?\\b`,'i'));}
function sentenceWithBlank(w){const text=String(w?.example||''),match=sentenceMatch(w);if(!match)return '';const start=match.index;return esc(text.slice(0,start))+`<span class="sentence-blank" aria-label="λέξη που λείπει">_____</span>`+esc(text.slice(start+match[0].length));}
function sentenceCandidates(){return candidates(db.words.length).filter(w=>sentenceMatch(w));}
function createQuizSession(ids){return {items:[...ids],initialItems:[...ids],progressBefore:clone(db.progress),eventsBefore:clone(db.events),index:0,correct:0,selected:null,typed:'',marked:false,finished:false};}
function startQuiz(){let items=testMode==='sentences'?sentenceCandidates():candidates(10);items=items.slice(0,10);quiz=createQuizSession(items.map(w=>w.id));render();}
function resetQuizSession(){if(!quiz?.initialItems?.length)return;if(!confirm('Να ξεκινήσει ξανά το τεστ από την πρώτη ερώτηση; Οι απαντήσεις και η βαθμολογία αυτού του τεστ θα μηδενιστούν.'))return;const ids=[...quiz.initialItems];db.progress=clone(quiz.progressBefore);db.events=clone(quiz.eventsBefore);save();quiz=createQuizSession(ids);render();showToast('Το τεστ ξεκίνησε ξανά από την αρχή.');}
function currentQuizWord(){return quiz&&getWord(quiz.items[quiz.index]);}
function quizNext(){if(!quiz)return;quiz.index++;quiz.selected=null;quiz.typed='';quiz.marked=false;if(quiz.index>=quiz.items.length)quiz.finished=true;render();}
function quizAnswer(answer){if(!quiz||quiz.marked)return;const w=currentQuizWord();if(!w)return;const correct=normalize(answer)===normalize(w.en);quiz.selected=answer;quiz.marked=true;if(correct)quiz.correct++;updateProgress(w,correct?'correct':'wrong');render();}
function quizChoices(w){let distractors=shuffle(db.words.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.en);if(!quiz._choices||quiz._choiceFor!==w.id){quiz._choiceFor=w.id;quiz._choices=shuffle([w.en,...distractors]);}return quiz._choices;}
function test(){if(!quiz){const sentenceTotal=sentenceCandidates().length,isSentence=testMode==='sentences',available=isSentence?sentenceTotal:db.words.length;return `${topbar('Μικρό τεστ','Προσπάθησε να ανακαλέσεις την αγγλική λέξη.')}<main class="main"><div class="card"><div class="switcher"><button data-testmode="choices" class="${testMode==='choices'?'active':''}">4 επιλογές</button><button data-testmode="sentences" class="${testMode==='sentences'?'active':''}">Σε προτάσεις</button><button data-testmode="typing" class="${testMode==='typing'?'active':''}">Γράψιμο</button></div><h2 class="section-title">${Math.min(10,available)} ερωτήσεις</h2><p class="small">${isSentence?'Θα λείπει μία λέξη από την αγγλική πρόταση. Διάλεξε ποια από τις τέσσερις επιλογές συμπληρώνει σωστά το κενό.':'Θα δεις μια ελληνική σημασία. Διάλεξε ή γράψε την αγγλική λέξη.'} Οι λανθασμένες απαντήσεις μπαίνουν σε πιο σύντομη επανάληψη.</p>${isSentence&&!sentenceTotal?'<div class="notice">Πρόσθεσε παραδείγματα προτάσεων στις λέξεις για να χρησιμοποιήσεις αυτό το τεστ.</div>':''}<button class="btn primary block" data-startquiz="true" ${available?'':'disabled'}>Έναρξη τεστ</button></div></main>`;}
 if(quiz.finished||!currentQuizWord()){return `${topbar('Αποτελέσματα τεστ','Έλεγξες τι θυμάσαι χωρίς βοήθεια.')}<main class="main"><div class="study-end"><div class="medal">🎯</div><div style="font-size:40px;font-weight:850">${quiz.correct} / ${quiz.items.length}</div><p>Σωστές απαντήσεις</p><p class="small">Οι λανθασμένες λέξεις θα επανέλθουν στην εξάσκηση.</p><div class="vstack"><button class="btn light block" data-reset-quiz="true">↻ Reset · Ξεκίνα από την αρχή</button><button class="btn primary block" data-startquiz="true">Νέο τεστ</button><button class="btn white block" data-nav="home">Σήμερα</button></div></div></main>`;}
 const w=currentQuizWord();let feedback='';if(quiz.marked){const correct=normalize(quiz.selected)===normalize(w.en);feedback=`<div class="${correct?'feature':'notice'}" style="margin:13px 0">${correct?'✓ Σωστό!':'✗ Η σωστή λέξη είναι: <b>'+esc(w.en)+'</b>'}${w.example?`<div class="small" style="margin-top:6px">${esc(w.example)}</div>`:''}</div><button class="btn primary block" data-nextquiz="true">${quiz.index+1<quiz.items.length?'Επόμενη ερώτηση →':'Δες αποτέλεσμα'}</button>`;}
 const sentenceMode=testMode==='sentences',choiceMode=testMode!=='typing';return `${topbar('Μικρό τεστ',sentenceMode?'Συμπλήρωσε τη λέξη που λείπει.':testMode==='choices'?'Βρες τη σωστή αγγλική λέξη.':'Πληκτρολόγησε την αγγλική λέξη.')}<main class="main"><div class="between"><span class="pill gray">Ερώτηση ${quiz.index+1} / ${quiz.items.length}</span><span class="small">${quiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${quiz.index/quiz.items.length*100}%"></span></div><div class="card"><div class="tiny-label">${sentenceMode?'Ποια λέξη συμπληρώνει την πρόταση;':'Πώς λέμε στα αγγλικά;'}</div>${sentenceMode?`<div class="sentence-prompt">${sentenceWithBlank(w)}</div>`:`<div class="word" style="font-size:25px;line-height:1.35;margin:20px 0">${esc(w.el)}</div>`}${choiceMode?quizChoices(w).map(ans=>`<button class="choice ${quiz.marked?(ans===w.en?'correct':ans===quiz.selected?'wrong':''):''}" data-answer="${esc(ans)}" ${quiz.marked?'disabled':''}>${esc(ans)}</button>`).join(''):`<div><form id="quizform"><input class="textinput" name="answer" id="typedAnswer" aria-label="Αγγλική λέξη" placeholder="Γράψε την αγγλική λέξη..." autocomplete="off" autocapitalize="none" spellcheck="false" ${quiz.marked?'disabled':''} value="${esc(quiz.typed||'')}"><button class="btn primary block" style="margin-top:12px" ${quiz.marked?'disabled':''} type="submit">Έλεγχος</button></form></div>`}${feedback}</div><div class="actions"><button class="btn sm light" data-reset-quiz="true">↻ Reset συνεδρίας</button><button class="btn sm white" data-stopquiz="true">Τέλος τεστ</button></div></main>`;}
function words(){const match=db.words.filter(w=>{if(wordFilter==='new'&&stat(w).seen!==0)return false;if(wordFilter==='due'&&!(stat(w).seen>0 && stat(w).due<=Date.now()))return false;if(wordFilter==='learned'&&stat(w).seen===0)return false;return (w.en+' '+w.el+' '+w.unit).toLowerCase().includes(searchTerm.toLowerCase());});return `${topbar('Οι λέξεις σου','Αποθήκευσε και εξάσκησε όσες λίστες χρειαστείς.')}<main class="main">${warn()}<div class="actions" style="margin-bottom:14px"><button class="btn primary" data-openimport="true">＋ Προσθήκη λέξεων</button><button class="btn light" data-openbackups="true">⚙ Αντίγραφα</button></div><input id="wordsearch" class="textinput" aria-label="Αναζήτηση λέξης" placeholder="🔎 Αναζήτηση στα αγγλικά ή ελληνικά..." value="${esc(searchTerm)}"><div class="chiprow">${[['all','Όλες'],['new','Νέες'],['due','Επανάληψη'],['learned','Μελετημένες']].map(([id,title])=>`<button class="chip ${wordFilter===id?'active':''}" data-filter="${id}">${title}</button>`).join('')}</div><div class="card"><div class="between"><b>Λεξιλόγιο</b><span class="pill gray">${match.length} / ${db.words.length}</span></div><div id="wordresults">${match.length?match.map(w=>{const p=stat(w);return `<div class="word-row"><div style="min-width:0;flex:1"><div class="wrd">${esc(w.en)}</div><div class="mean">${esc(w.el)}</div></div><div class="right"><span class="pill ${p.seen?'':'gray'}">${p.seen?(p.due<=Date.now()?'επανάληψη':'μελετήθηκε'):'νέα'}</span><button class="linklike" data-word="${esc(w.id)}">Άνοιγμα</button></div></div>`}).join(''):'<p class="small">Δεν υπάρχουν λέξεις με αυτό το φίλτρο.</p>'}</div></div><div class="footer-note">Μπορείς να στείλεις φωτογραφίες με επιπλέον λίστες στη συνομιλία, ώστε να τις μετατρέψω σε έτοιμο κείμενο εισαγωγής.</div></main>`;}
function englishMenu(){const subject=subjectById('english')||englishSubject();return `<header class="subject-head english-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main">${warn()}<div class="card english-intro"><span class="pill">Δύο ξεχωριστές ενότητες</span><h2 class="section-title" style="margin-top:10px">Τι θέλεις να εξασκήσεις;</h2><p class="small">Οι λέξεις κρατούν την υπάρχουσα πρόοδο, τις εικόνες, τις ιστορίες και τα τεστ σου. Η γραμματική έχει δική της θεωρία, εξάσκηση και βαθμολογία.</p></div><div class="subject-grid"><button class="subject-card category-card" data-open-english="vocabulary"><span class="subject-icon">📚</span><span class="subject-card-content"><h3>Λέξεις</h3><p>Κάρτες, ιστορίες, εικόνες και τεστ λεξιλογίου.</p><span class="subject-meta"><span class="pill gray">${db.words.length} λέξεις</span><span class="pill gray">${learnedCount()} μελετημένες</span>${dueWords().length?`<span class="pill warn">${dueWords().length} επαναλήψεις</span>`:''}</span></span><span class="subject-arrow">›</span></button><button class="subject-card category-card" data-open-english="grammar"><span class="subject-icon">✍️</span><span class="subject-card-content"><h3>Γραμματική</h3><p>Would rather / sooner και would prefer.</p><span class="subject-meta"><span class="pill warn">Preference</span><span class="pill gray">12 ερωτήσεις</span>${db.grammar.attempts?`<span class="pill gray">Καλύτερο ${db.grammar.bestScore}/100</span>`:''}</span></span><span class="subject-arrow">›</span></button></div></main>`;}
function grammarRuleCard(title,form,example,meaning,visualId=''){const visual=grammarVisuals[visualId];return `<section class="card grammar-rule ${visual?'has-image':''}">${visual?`<img class="grammar-rule-image" src="${esc(visual.src)}" alt="${esc(visual.alt)}" loading="lazy"><div class="grammar-image-prompt"><span>👁️</span><span>${esc(visual.prompt)}</span></div>`:''}<h3>${esc(title)}</h3><span class="grammar-form">${esc(form)}</span><div class="grammar-example"><b>${esc(example)}</b><br><span class="small">${esc(meaning)}</span></div></section>`;}
function grammarLessonPage(){return `<div class="card grammar-objectives"><span class="pill gray">Preference</span><h2 class="section-title" style="margin-top:10px">Would rather / sooner · Would prefer</h2><p class="small">Παρατήρησε πρώτα τις εικόνες και μετά τον κανόνα. Έτσι θα ξεχωρίζεις ποιος προτιμά, ποιος ενεργεί και αν μιλάμε για τώρα ή για το παρελθόν.</p></div><div class="grammar-section-title"><span>ΤΩΡΑ / ΜΕΛΛΟΝ</span><h2>Παρόν ή μελλοντική προτίμηση</h2></div>${grammarRuleCard('Would rather / sooner · ίδιο υποκείμενο','subject + would rather/sooner + bare infinitive','I’d rather leave early.','Θα προτιμούσα να φύγω νωρίς.','same-now')}${grammarRuleCard('Would rather / sooner · άλλο υποκείμενο','subject + would rather/sooner + person + past simple','I’d rather Alex took the bus.','Θα προτιμούσα ο Alex να πάρει το λεωφορείο.','other-now')}${grammarRuleCard('Would prefer · ίδιο υποκείμενο','subject + would prefer + (not) to-infinitive','Maya would prefer not to wait.','Η Maya θα προτιμούσε να μην περιμένει.')}${grammarRuleCard('Would prefer · άλλο υποκείμενο','subject + would prefer it if + person + past simple','We’d prefer it if you arrived earlier.','Θα προτιμούσαμε να έφτανες νωρίτερα.')}<div class="grammar-note"><b>Πρόσεξε:</b> το past simple μετά από διαφορετικό υποκείμενο δεν δηλώνει παρελθόν. Δείχνει μια επιθυμητή ή υποθετική αλλαγή στο παρόν/μέλλον.</div><div class="grammar-section-title"><span>ΠΑΡΕΛΘΟΝ</span><h2>Προτίμηση που δεν πραγματοποιήθηκε</h2></div>${grammarRuleCard('Would rather · ίδιο υποκείμενο','subject + would rather + have + past participle','I’d rather have booked earlier.','Θα προτιμούσα να είχα κάνει κράτηση νωρίτερα.','past-regret')}${grammarRuleCard('Would rather · άλλο υποκείμενο','subject + would rather + person + past perfect','I’d rather you had called first.','Θα προτιμούσα να είχες τηλεφωνήσει πρώτα.')}${grammarRuleCard('Would prefer · ίδιο υποκείμενο','subject + would have preferred + to have + past participle','Lena would have preferred to have travelled by train.','Η Lena θα προτιμούσε να είχε ταξιδέψει με τρένο.')}${grammarRuleCard('Would prefer · άλλο υποκείμενο','subject + would have preferred it if + person + past perfect','They would have preferred it if we had stayed.','Θα προτιμούσαν να είχαμε μείνει.')}<div class="grammar-note"><b>Γρήγορο κλειδί:</b> ίδιο πρόσωπο → infinitive. Διαφορετικό πρόσωπο → δικό του υποκείμενο και past simple ή past perfect.</div><button class="btn primary block" data-grammar-start="true">Ξεκίνα την εξάσκηση →</button>`;}
function startGrammarQuiz(){grammarQuiz={items:shuffle(grammarQuestions.map((_,index)=>index)),index:0,correct:0,selected:null,marked:false,finished:false};grammarView='quiz';render();window.scrollTo(0,0);}
function currentGrammarQuestion(){return grammarQuiz?grammarQuestions[grammarQuiz.items[grammarQuiz.index]]:null;}
function answerGrammarQuestion(index){if(!grammarQuiz||grammarQuiz.marked)return;const question=currentGrammarQuestion();grammarQuiz.selected=Number(index);grammarQuiz.marked=true;if(grammarQuiz.selected===question.answer)grammarQuiz.correct++;render();}
function finishGrammarQuiz(){if(!grammarQuiz||grammarQuiz.finished)return;grammarQuiz.finished=true;const score=Math.round(grammarQuiz.correct/grammarQuiz.items.length*100);db.grammar.lastScore=score;db.grammar.bestScore=Math.max(db.grammar.bestScore,score);db.grammar.attempts++;save();render();}
function nextGrammarQuestion(){if(!grammarQuiz)return;if(grammarQuiz.index+1>=grammarQuiz.items.length){finishGrammarQuiz();return;}grammarQuiz.index++;grammarQuiz.selected=null;grammarQuiz.marked=false;render();window.scrollTo(0,0);}
function resetGrammarQuiz(){if(grammarQuiz&&!confirm('Να ξεκινήσει ξανά η εξάσκηση Γραμματικής από την πρώτη ερώτηση;'))return;startGrammarQuiz();showToast('Η εξάσκηση Γραμματικής ξεκίνησε από την αρχή.');}
function grammarQuizImage(question){const visual=grammarVisuals[question.visual];if(!visual)return '';return `<img class="grammar-quiz-image" src="${esc(visual.src)}" alt="${esc(visual.alt)}"><div class="grammar-image-label"><span>🖼️</span><span>Διάβασε τη σκηνή πριν επιλέξεις τον σωστό τύπο.</span></div>`;}
function grammarQuizPage(){if(!grammarQuiz){return `<div class="card grammar-objectives"><span class="pill gray">Εξάσκηση</span><h2 class="section-title" style="margin-top:10px">Τεστ 12 ερωτήσεων</h2><p class="small">Διάλεξε τη σωστή δομή για παρόν, μέλλον ή παρελθόν. Σε τρεις ερωτήσεις η εικόνα σε βοηθά να αναγνωρίσεις το νόημα πριν επιλέξεις τύπο.</p>${db.grammar.attempts?`<div class="grid3" style="margin:16px 0"><div class="stat"><b>${db.grammar.lastScore}</b><span>Τελευταίος βαθμός</span></div><div class="stat"><b>${db.grammar.bestScore}</b><span>Καλύτερος βαθμός</span></div><div class="stat"><b>${db.grammar.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<button class="btn primary block" data-grammar-start="true">Έναρξη εξάσκησης</button></div>`;}if(grammarQuiz.finished){const score=Math.round(grammarQuiz.correct/grammarQuiz.items.length*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${grammarQuiz.correct} σωστές απαντήσεις στις ${grammarQuiz.items.length}.</p><p class="history-score">Καλύτερη επίδοση: ${db.grammar.bestScore}/100 · ${db.grammar.attempts} ${db.grammar.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-grammar-reset="true">↻ Επανάληψη από την αρχή</button><button class="btn primary block" data-grammar-view="lesson">Επανάληψη θεωρίας</button><button class="btn white block" data-english-menu="true">Επιστροφή στα Αγγλικά</button></div>`;}const question=currentGrammarQuestion(),isCorrect=grammarQuiz.selected===question.answer;return `<div class="between"><span class="pill gray">Ερώτηση ${grammarQuiz.index+1} / ${grammarQuiz.items.length}</span><span class="small">${grammarQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${grammarQuiz.index/grammarQuiz.items.length*100}%"></span></div><div class="card">${grammarQuizImage(question)}<div class="tiny-label">Would rather / Would prefer</div><div class="grammar-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${grammarQuiz.marked?(index===question.answer?'correct':index===grammarQuiz.selected?'wrong':''):''}" data-grammar-answer="${index}" ${grammarQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${grammarQuiz.marked?`<div class="grammar-explain"><b>${isCorrect?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-grammar-next="true">${grammarQuiz.index+1<grammarQuiz.items.length?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-grammar-reset="true">↻ Reset εξάσκησης</button>`;}
function grammarModule(){const content=grammarView==='quiz'?grammarQuizPage():grammarLessonPage();return `<header class="subject-head grammar-head"><button class="subject-back" data-english-menu="true">← Αγγλικά</button><div class="subject-head-main"><span class="subject-icon">✍️</span><div><h1>Γραμματική</h1><p>Preference: would rather / sooner και would prefer</p></div></div></header><main class="main"><div class="grammar-tabs"><button data-grammar-view="lesson" class="${grammarView==='lesson'?'active':''}">📖 Θεωρία</button><button data-grammar-view="quiz" class="${grammarView==='quiz'?'active':''}">✅ Εξάσκηση</button></div>${content}</main>`;}
function focusHistoryMission(){requestAnimationFrame(()=>document.getElementById('history-mission')?.scrollIntoView({behavior:'smooth',block:'start'}));}
function showHistoryScene(index){historySceneIndex=(Number(index)+historyVisuals.length)%historyVisuals.length;historySceneRevealed=false;render();focusHistoryMission();}
function revealHistoryScene(){historySceneRevealed=true;render();focusHistoryMission();}
function hideHistoryScene(){historySceneRevealed=false;render();focusHistoryMission();}
function historyMission(){const item=historyVisuals[historySceneIndex];return `<section class="card history-mission" id="history-mission" data-history-mission="true"><div class="history-mission-top"><img class="history-mission-image" src="${esc(item.src)}" alt="Ιστορική αναπαράσταση για παρατήρηση" loading="eager"><span class="history-mission-counter">Σταθμός ${historySceneIndex+1} / ${historyVisuals.length}</span><div class="history-mission-teaser"><span>ΙΣΤΟΡΙΚΟΣ ΝΤΕΤΕΚΤΙΒ</span><h3>${historySceneRevealed?esc(item.title):'Μπορείς να αναγνωρίσεις τη στιγμή;'}</h3></div></div><div class="history-mission-body"><p class="history-mission-question">${esc(item.mission)}</p><div class="history-observe"><span>👁️</span><span><b>Παρατήρησε:</b> ${esc(item.observe)}</span></div>${historySceneRevealed?`<div class="history-reveal"><div class="history-reveal-title"><span class="history-year">${esc(item.year)}</span><b>${esc(item.title)}</b></div><p>${esc(item.reveal)}</p><p><b>Γιατί έχει σημασία:</b> ${esc(item.impact)}</p><div class="history-clues">${item.clues.map(clue=>`<div class="history-clue"><span>🔎</span><span>${esc(clue)}</span></div>`).join('')}</div></div>`:`<button class="btn teal block" data-history-reveal="true">🔎 Αποκάλυψε το γεγονός</button>`}<div class="history-mission-nav" style="margin-top:12px"><button class="btn light" data-history-scene="${historySceneIndex-1}" aria-label="Προηγούμενος σταθμός">←</button><button class="btn white" ${historySceneRevealed?'data-history-hide="true"':'data-history-reveal="true"'}>${historySceneRevealed?'Κρύψε την απάντηση':'Δώσε μου ένα στοιχείο'}</button><button class="btn light" data-history-scene="${historySceneIndex+1}" aria-label="Επόμενος σταθμός">→</button></div></div></section><div class="history-scene-dots" aria-label="Ιστορικοί σταθμοί">${historyVisuals.map((visual,index)=>`<button class="history-scene-dot ${index===historySceneIndex?'active':''}" data-history-scene="${index}" aria-label="Σταθμός ${index+1}: ${esc(visual.title)}"></button>`).join('')}</div>`;}
function historyLessonPage(){return `<div class="card history-objectives"><span class="pill warn">Σελίδες 30–32</span><h2 class="section-title" style="margin-top:10px">Η εξέλιξη της Ελληνικής Επανάστασης (1821–1827)</h2><p class="small">Μην αποστηθίσεις απλώς χρονολογίες. Μπες στις σκηνές, ψάξε τα στοιχεία και ανακάλυψε πώς μια επιτυχία, μια κρίση και μια διεθνής απόφαση άλλαξαν την πορεία του Αγώνα.</p></div><h2 class="section-title">🎯 Αποστολή: Γίνε ιστορικός ντετέκτιβ</h2><p class="small" style="margin-top:-7px">Παρατήρησε πρώτα την εικόνα και κάνε τη δική σου υπόθεση. Μετά πάτησε την αποκάλυψη.</p>${historyMission()}<div class="notice">Οι εικόνες είναι σύγχρονες ψηφιακές ιστορικές αναπαραστάσεις για εκπαιδευτική χρήση και όχι αυθεντικές φωτογραφίες της εποχής.</div><h2 class="section-title">Σύνδεσε τα γεγονότα</h2><div class="timeline">${historyTimeline.map(item=>`<div class="timeline-item"><div class="timeline-year">${esc(item.year)}</div><div class="timeline-line"></div><div class="timeline-copy"><b>${esc(item.title)}</b><span>${esc(item.text)}</span></div></div>`).join('')}</div><h2 class="section-title">Η μεγάλη εικόνα σε 4 κεφάλαια</h2>${historySections.map(section=>`<section class="card history-section"><h3>${esc(section.title)}</h3><p>${esc(section.text)}</p></section>`).join('')}<div class="notice">Το κείμενο αποτελεί εκπαιδευτική σύνοψη των τριών σελίδων και όχι αυτούσια αντιγραφή του σχολικού βιβλίου.</div><button class="btn primary block" data-history-view="quiz">Δοκίμασε τι ανακάλυψες →</button>`;}
function startHistoryQuiz(){historyQuiz={index:0,correct:0,selected:null,marked:false,finished:false};historyView='quiz';render();}
function answerHistoryQuestion(index){if(!historyQuiz||historyQuiz.marked)return;const question=historyQuestions[historyQuiz.index];historyQuiz.selected=Number(index);historyQuiz.marked=true;if(historyQuiz.selected===question.answer)historyQuiz.correct++;render();}
function finishHistoryQuiz(){if(!historyQuiz||historyQuiz.finished)return;historyQuiz.finished=true;const score=Math.round(historyQuiz.correct/historyQuestions.length*100);db.history.lastScore=score;db.history.bestScore=Math.max(db.history.bestScore,score);db.history.attempts++;save();render();}
function nextHistoryQuestion(){if(!historyQuiz)return;if(historyQuiz.index+1>=historyQuestions.length){finishHistoryQuiz();return;}historyQuiz.index++;historyQuiz.selected=null;historyQuiz.marked=false;render();}
function resetHistoryQuiz(){if(historyQuiz&&!confirm('Να ξεκινήσει ξανά το τεστ Ιστορίας από την πρώτη ερώτηση;'))return;startHistoryQuiz();showToast('Το τεστ Ιστορίας ξεκίνησε από την αρχή.');}
function historyQuizImage(question){if(!Number.isInteger(question.visual)||!historyVisuals[question.visual])return '';const visual=historyVisuals[question.visual];return `<img class="history-quiz-image" src="${esc(visual.src)}" alt="Ιστορική αναπαράσταση: ${esc(visual.title)}"><div class="history-image-label"><span>🖼️</span><span>Χρησιμοποίησε και την εικόνα ως στοιχείο.</span></div>`;}
function historyQuizPage(){if(!historyQuiz){return `<div class="card history-objectives"><span class="pill warn">Κατανόηση</span><h2 class="section-title" style="margin-top:10px">Τεστ 10 ερωτήσεων</h2><p class="small">Οι ερωτήσεις ελέγχουν γεγονότα, χρονολογική σειρά και σχέσεις αιτίας–αποτελέσματος. Σε τέσσερις ερωτήσεις η εικόνα λειτουργεί και ως ιστορικό στοιχείο.</p>${db.history.attempts?`<div class="grid3" style="margin:16px 0"><div class="stat"><b>${db.history.lastScore}</b><span>Τελευταίος βαθμός</span></div><div class="stat"><b>${db.history.bestScore}</b><span>Καλύτερος βαθμός</span></div><div class="stat"><b>${db.history.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<button class="btn primary block" data-history-start="true">Έναρξη τεστ</button></div>`;}if(historyQuiz.finished){const score=Math.round(historyQuiz.correct/historyQuestions.length*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${historyQuiz.correct} σωστές απαντήσεις στις ${historyQuestions.length}.</p><p class="history-score">Καλύτερη επίδοση: ${db.history.bestScore}/100 · ${db.history.attempts} ${db.history.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-history-reset="true">↻ Επανάληψη του ίδιου τεστ</button><button class="btn primary block" data-history-view="critical">Ασκήσεις κριτικής σκέψης</button><button class="btn white block" data-history-view="lesson">Επιστροφή στο μάθημα</button></div>`;}const question=historyQuestions[historyQuiz.index],isCorrect=historyQuiz.selected===question.answer;return `<div class="between"><span class="pill gray">Ερώτηση ${historyQuiz.index+1} / ${historyQuestions.length}</span><span class="small">${historyQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${historyQuiz.index/historyQuestions.length*100}%"></span></div><div class="card">${historyQuizImage(question)}<div class="tiny-label">Κατανόηση και αιτιολόγηση</div><div class="history-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${historyQuiz.marked?(index===question.answer?'correct':index===historyQuiz.selected?'wrong':''):''}" data-history-answer="${index}" ${historyQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${historyQuiz.marked?`<div class="history-explain"><b>${isCorrect?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-history-next="true">${historyQuiz.index+1<historyQuestions.length?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-history-reset="true">↻ Reset τεστ</button>`;}
function captureHistoryResponses(){document.querySelectorAll('[data-history-response]').forEach(field=>{db.history.responses[field.dataset.historyResponse]=field.value.trim();});}
function toggleHistoryGuide(id){captureHistoryResponses();save();if(historyGuides.has(id))historyGuides.delete(id);else historyGuides.add(id);render();}
function saveHistoryResponses(){captureHistoryResponses();save();render();showToast('Οι απαντήσεις Ιστορίας αποθηκεύτηκαν.');}
function historyCriticalPage(){const completed=historyCriticalPrompts.filter(item=>String(db.history.responses[item.id]||'').trim()).length;return `<div class="card history-objectives"><span class="pill warn">Κριτική σκέψη</span><h2 class="section-title" style="margin-top:10px">Τεκμηρίωσε τη θέση σου</h2><p class="small">Δεν υπάρχει μία μοναδική σωστή απάντηση. Χρησιμοποίησε στοιχεία από το μάθημα, εξήγησε τη συλλογιστική σου και εξέτασε περισσότερες από μία οπτικές.</p><div class="progress-track"><div class="progress-bar" style="width:${completed/historyCriticalPrompts.length*100}%"></div></div><span class="small">${completed} / ${historyCriticalPrompts.length} απαντήσεις αποθηκευμένες</span></div>${historyCriticalPrompts.map((item,index)=>`<section class="card critical-card"><span class="pill gray">Άσκηση ${index+1}</span><h3>${esc(item.title)}</h3><p class="small">${esc(item.prompt)}</p><textarea class="textarea" data-history-response="${esc(item.id)}" placeholder="Γράψε εδώ την τεκμηριωμένη απάντησή σου...">${esc(db.history.responses[item.id]||'')}</textarea><button class="btn sm light" style="margin-top:9px" data-history-guide="${esc(item.id)}">${historyGuides.has(item.id)?'Κρύψε':'Δείξε'} σημεία αυτοελέγχου</button>${historyGuides.has(item.id)?`<div class="critical-guide"><b>Σημεία αυτοελέγχου:</b><br>${esc(item.guide)}</div>`:''}</section>`).join('')}<button class="btn primary block" data-history-save="true">💾 Αποθήκευση απαντήσεων</button><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Κριτήρια καλής ιστορικής απάντησης</h3><div class="rubric-list"><div class="rubric-item">✓ <span>Διατυπώνω καθαρή θέση και απαντώ ακριβώς στο ερώτημα.</span></div><div class="rubric-item">✓ <span>Χρησιμοποιώ τουλάχιστον δύο συγκεκριμένα ιστορικά στοιχεία.</span></div><div class="rubric-item">✓ <span>Εξηγώ σχέσεις αιτίας–αποτελέσματος, όχι μόνο γεγονότα.</span></div><div class="rubric-item">✓ <span>Εξετάζω αντίλογο ή διαφορετική οπτική.</span></div><div class="rubric-item">✓ <span>Ξεχωρίζω το τεκμήριο από την προσωπική μου υπόθεση.</span></div></div></div>`;}
function historyModule(){const subject=subjectById('history')||historySubject(),content=historyView==='quiz'?historyQuizPage():historyView==='critical'?historyCriticalPage():historyLessonPage();return `<header class="subject-head history-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main"><div class="history-tabs"><button data-history-view="lesson" class="${historyView==='lesson'?'active':''}">📖 Μάθημα</button><button data-history-view="quiz" class="${historyView==='quiz'?'active':''}">✅ Κατανόηση</button><button data-history-view="critical" class="${historyView==='critical'?'active':''}">💭 Κριτική</button></div>${content}</main>`;}
function currentEssayTopic(){return essayTopics.find(topic=>topic.id===db.essay.topicId)||essayTopics[0];}
function essayTopicAxes(topic=currentEssayTopic()){return topic.axisIds.map(id=>essayAxes.find(axis=>axis.id===id)).filter(Boolean);}
function essayAxis(id){return essayAxes.find(axis=>axis.id===id);}
function currentEssayPlan(){return db.essay.plans[currentEssayTopic().id]||{};}
function essayValue(field){return String(currentEssayPlan()[field]||'');}
function essaySelectedAxis(index){const topic=currentEssayTopic(),saved=essayValue(`body${index}Theme`);return essayAxis(saved)&&topic.axisIds.includes(saved)?saved:topic.axisIds[index-1]||topic.axisIds[0];}
function captureEssayPlan(){const plan={...currentEssayPlan()};document.querySelectorAll('[data-essay-field]').forEach(field=>{plan[field.dataset.essayField]=field.value.trim();});db.essay.plans[currentEssayTopic().id]=plan;}
function saveEssayPlan(){captureEssayPlan();save();render();showToast('Το σχεδιάγραμμα αποθηκεύτηκε.');}
function chooseEssayTopic(id){if(!essayTopics.some(topic=>topic.id===id))return;if(essayView==='plan')captureEssayPlan();db.essay.topicId=id;save();render();window.scrollTo(0,0);}
function essayTextarea(field,label,help,placeholder,rows=3){return `<label class="inputlabel" for="essay-${esc(field)}">${esc(label)}</label>${help?`<div class="essay-field-help">${esc(help)}</div>`:''}<textarea id="essay-${esc(field)}" class="textarea" rows="${rows}" data-essay-field="${esc(field)}" placeholder="${esc(placeholder)}">${esc(essayValue(field))}</textarea>`;}
function essayAxisOptions(selected){return essayTopicAxes().map(axis=>`<option value="${esc(axis.id)}" ${axis.id===selected?'selected':''}>${esc(axis.title)}</option>`).join('');}
function essayThemesPage(){const topic=currentEssayTopic();return `<div class="card essay-intro"><span class="pill">Στρατηγική γραφής</span><h2 class="section-title" style="margin-top:10px">Πρώτα σχεδιάζω, μετά γράφω</h2><p class="small">Το υλικό των φωτογραφιών γίνεται τράπεζα ιδεών. Δεν χρειάζεται να χρησιμοποιηθούν όλα: για ένα κείμενο ${esc(topic.goal)} επιλέγουμε συνήθως τρεις διαφορετικούς άξονες και τους συνδέουμε λογικά.</p><div class="essay-cycle"><div class="essay-cycle-step">1<b>Μοντέλο</b>Βλέπω τη δομή</div><div class="essay-cycle-step">2<b>Πράξη</b>Στήνω σκελετό</div><div class="essay-cycle-step">3<b>Έλεγχος</b>Βελτιώνω</div></div></div><h2 class="section-title">Διάλεξε θέμα</h2>${essayTopics.map(item=>`<button class="essay-topic ${item.id===topic.id?'active':''}" data-essay-topic="${esc(item.id)}"><h3>${esc(item.title)}</h3><p>${esc(item.prompt)}</p><div class="subject-meta"><span class="pill gray">${esc(item.goal)}</span><span class="pill gray">${item.axisIds.length} θεματικοί άξονες</span></div></button>`).join('')}<h2 class="section-title" style="margin-top:20px">Τράπεζα θεματικών ενοτήτων</h2><div class="essay-axis-grid">${essayTopicAxes(topic).map((axis,index)=>`<article class="essay-axis"><span class="pill gray">${String(index+1).padStart(2,'0')}</span><h3>${esc(axis.title)}</h3><p>${esc(axis.idea)}</p><div class="essay-question"><b>Ρώτησε:</b> ${esc(axis.question)}</div><div class="essay-keywords">${axis.keywords.map(word=>`<span class="essay-keyword">${esc(word)}</span>`).join('')}</div></article>`).join('')}</div><p class="essay-source-note">Οι άξονες οργανώθηκαν από το υλικό που ανέβασες: αξία της γλώσσας, άτομο, κοινωνία, σύγχρονες προκλήσεις, γλωσσικό πρόβλημα και γλωσσομάθεια.</p><button class="btn primary block" style="margin-top:16px" data-essay-view="plan">Στήσε το σχεδιάγραμμα →</button>`;}
function essayParagraphPlanner(index){const selected=essaySelectedAxis(index),axis=essayAxis(selected);return `<div class="essay-paragraph"><h4>Παράγραφος ${index}</h4><label class="inputlabel" for="essay-body${index}Theme">Θεματική ενότητα</label><select id="essay-body${index}Theme" class="textinput" data-essay-field="body${index}Theme" data-essay-axis="true">${essayAxisOptions(selected)}</select><div class="essay-question"><b>Κεντρική ερώτηση:</b> ${esc(axis?.question||'')}</div>${essayTextarea(`body${index}Claim`,'Θεματική περίοδος','Μία καθαρή πρόταση που απαντά στην κεντρική ερώτηση.','Η γλώσσα...')}${essayTextarea(`body${index}Support`,'Ανάπτυξη – αιτιολόγηση','Εξήγησε πώς ή γιατί ισχύει η θέση σου.','Αυτό συμβαίνει επειδή...')}${essayTextarea(`body${index}Example`,'Τεκμήριο ή παράδειγμα','Χρησιμοποίησε παράδειγμα, συνέπεια, σύγκριση ή σύντομο τεκμήριο.','Για παράδειγμα...')}${essayTextarea(`body${index}Link`,'Κατακλείδα – σύνδεση','Κλείσε την ιδέα και οδήγησε ομαλά στην επόμενη.','Επομένως...')}</div>`;}
function essayPlanPage(){const fields=['interpretation','purpose','thesis','introOpening','introContext','body1Claim','body1Support','body1Example','body1Link','body2Claim','body2Support','body2Example','body2Link','body3Claim','body3Support','body3Example','body3Link','conclusionSynthesis','conclusionFinal'],done=fields.filter(field=>essayValue(field)).length,topic=currentEssayTopic();return `<div class="card essay-intro"><span class="pill warn">${esc(topic.goal)}</span><h2 class="section-title" style="margin-top:10px">${esc(topic.title)}</h2><p class="small">${esc(topic.prompt)}</p><div class="progress-track"><div class="progress-bar" style="width:${done/fields.length*100}%"></div></div><div class="essay-progress-label">${done} / ${fields.length} στοιχεία σχεδιασμένα</div></div><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">1</div><div><h3>Κατανόησε την εκφώνηση</h3><span>Θέμα · σκοπός · κεντρική θέση</span></div></div>${essayTextarea('interpretation','Τι ακριβώς μου ζητά;','Ξαναγράψε την εκφώνηση με δικά σου λόγια.','Πρέπει να εξηγήσω...')}${essayTextarea('purpose','Σε ποιον γράφω και με ποιον σκοπό;','Σκέψου αναγνώστη, είδος κειμένου και επιδιωκόμενο αποτέλεσμα.','Απευθύνομαι σε... και θέλω να...')}${essayTextarea('thesis','Κεντρική θέση','Μία πρόταση που θα αποδεικνύει ολόκληρο το κείμενο.','Υποστηρίζω ότι...')}</section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">2</div><div><h3>Στήσε το κύριο μέρος</h3><span>Τρεις διαφορετικοί άξονες · μία ιδέα ανά παράγραφο</span></div></div><div class="essay-question"><b>Κανόνας:</b> Θεματική περίοδος → αιτιολόγηση → παράδειγμα/τεκμήριο → κατακλείδα.</div>${[1,2,3].map(essayParagraphPlanner).join('')}</section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">3</div><div><h3>Σχεδίασε τον πρόλογο</h3><span>Άνοιγμα · πλαίσιο · μετάβαση στη θέση</span></div></div>${essayTextarea('introOpening','Πώς θα ανοίξεις το θέμα;','Επίλεξε σύντομο ορισμό, διαπίστωση, αντίθεση ή ερώτημα.','Στη σύγχρονη εποχή...')}${essayTextarea('introContext','Πώς θα το συνδέσεις με την εκφώνηση;','Δώσε μόνο το αναγκαίο πλαίσιο· μην αναπτύξεις ακόμη τα επιχειρήματα.','Η σημασία του ζητήματος γίνεται φανερή...')}<div class="essay-question"><b>Η θέση σου:</b> ${esc(essayValue('thesis')||'Συμπλήρωσέ την στο Βήμα 1.')}</div></section><section class="card essay-step"><div class="essay-step-head"><div class="essay-step-number">4</div><div><h3>Σχεδίασε τον επίλογο</h3><span>Σύνθεση · τελική προοπτική</span></div></div>${essayTextarea('conclusionSynthesis','Τι συμπέρασμα προκύπτει;','Σύνθεσε τις τρεις ιδέες χωρίς μηχανική επανάληψη.','Συνολικά, γίνεται φανερό ότι...')}${essayTextarea('conclusionFinal','Με ποια σκέψη θα κλείσεις;','Πρόταση, προοπτική, προϋπόθεση ή σύντομη παρότρυνση.','Το ζητούμενο, λοιπόν, είναι...')}</section><div class="vstack"><button class="btn primary block" data-essay-save="true">💾 Αποθήκευση σχεδιαγράμματος</button><button class="btn teal block" data-essay-view="review">Έλεγχος της δομής →</button><button class="btn light block" data-essay-reset="true">↻ Καθαρισμός αυτού του σχεδιαγράμματος</button></div>`;}
function essayOutlineLine(label,value){return `<div class="essay-outline-line"><b>${esc(label)}:</b> ${value?esc(value):'<span class="essay-empty-line">Δεν έχει συμπληρωθεί ακόμη</span>'}</div>`;}

function importModal(){return `<div class="overlay" data-overlay="true"><section role="dialog" aria-modal="true" aria-label="Προσθήκη λέξεων" class="sheet"><div class="between"><h3>Προσθήκη νέων λέξεων</h3><button class="btn sm light" data-closemodal="true">✕</button></div><p class="small">Μία λέξη ανά γραμμή. Γράψε <b>αγγλικά = ελληνικά</b>. Προαιρετικά βάλε αγγλική και ελληνική πρόταση μετά το <b>|</b>.</p><textarea id="importtext" class="textarea" placeholder="curtail = περιορίζω | They curtailed expenses. | Περιόρισαν τις δαπάνες.&#10;resilient = ανθεκτικός&#10;glimpse = φευγαλέα ματιά"></textarea><p class="small">Δέχεται και αρχεία <span class="kbd">.txt</span>, <span class="kbd">.csv</span> με διαχωριστικό ; ή tab, και πακέτα ιστοριών <span class="kbd">.json</span>.</p><input id="importfile" type="file" accept=".txt,.csv,.tsv,.json,text/plain,text/csv,application/json" style="max-width:100%;margin:8px 0 13px"><label class="inputlabel" for="importunit">Όνομα λίστας (προαιρετικό)</label><input class="textinput" id="importunit" placeholder="π.χ. Test 5" value="Test 5"><div class="vstack" style="margin-top:17px"><button class="btn primary block" data-import="true">Πρόσθεσε τις λέξεις</button><button class="btn white block" data-closemodal="true">Ακύρωση</button></div></section></div>`;}
function backupModal(){return `<div class="overlay" data-overlay="true"><section role="dialog" aria-modal="true" aria-label="Αποθήκευση και ρυθμίσεις" class="sheet"><div class="between"><h3>Ρυθμίσεις και αντίγραφα</h3><button class="btn sm light" data-closemodal="true">✕</button></div><p class="small">Η πρόοδος είναι τοπική. Κράτα αντίγραφο JSON για μεταφορά σε άλλο κινητό ή για να μη χαθεί αν καθαρίσεις τα δεδομένα του Safari.</p><div class="vstack"><button class="btn primary block" data-backup="true">⬇ Εξαγωγή λεξιλογίου + προόδου (.json)</button><button class="btn white block" data-exportcsv="true">⬇ Εξαγωγή λέξεων (.txt)</button></div><hr class="divider"><label class="inputlabel" for="restorefile">Επαναφορά αντιγράφου JSON</label><input id="restorefile" type="file" accept=".json,application/json" style="width:100%"><button class="btn light block" style="margin-top:11px" data-restore="true">Επαναφορά</button><hr class="divider"><label class="inputlabel" for="dailygoal">Ημερήσιος στόχος (διαφορετικές λέξεις)</label><select id="dailygoal" class="textinput">${[5,10,15,20,30].map(v=>`<option value="${v}" ${v===db.goal?'selected':''}>${v} λέξεις</option>`).join('')}</select><button class="btn white block" style="margin-top:11px" data-savegoal="true">Αποθήκευση στόχου</button><hr class="divider"><button class="btn danger block" data-resetprogress="true">Μηδενισμός προόδου (διατηρούνται οι λέξεις)</button></section></div>`;}
function modal(nameOrEl){document.getElementById('modal').innerHTML=nameOrEl||'';}
function render(){const app=document.getElementById('app');app.className=screen==='english'?'':'hub';if(screen==='subjects'){app.innerHTML=subjectsHome();return;}if(screen==='englishMenu'){app.innerHTML=englishMenu();return;}if(screen==='grammar'){app.innerHTML=grammarModule();return;}if(screen==='generic'){app.innerHTML=genericSubject();return;}if(screen==='history'){app.innerHTML=historyModule();return;}if(screen==='essay'){app.innerHTML=essayModule();return;}let content=({home,study,stories,test,words}[view]||home)();app.innerHTML=content+nav();if(wordInfoId){const w=getWord(wordInfoId);if(w)modal(infoModal(w));else wordInfoId=null;}}
function showToast(message){document.getElementById('toaster').innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toaster').innerHTML='',3200);}
function speak(value){if(!window.speechSynthesis){showToast('Η εκφώνηση δεν υποστηρίζεται σε αυτόν τον browser.');return;}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(value);utterance.lang='en-GB';utterance.rate=.83;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance);}
function prepareImage(file){return new Promise((resolve,reject)=>{if(!file||!String(file.type).startsWith('image/')){reject(Error('Επίλεξε αρχείο εικόνας.'));return;}if(file.size>12*1024*1024){reject(Error('Η εικόνα είναι πολύ μεγάλη. Επίλεξε αρχείο έως 12 MB.'));return;}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const maxSide=520,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const context=canvas.getContext('2d');context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(img,0,0,canvas.width,canvas.height);let quality=.78,data='';do{data=canvas.toDataURL('image/jpeg',quality);quality-=.1;}while(data.length>280000&&quality>=.38);URL.revokeObjectURL(url);if(data.length>320000)reject(Error('Η εικόνα δεν μπόρεσε να μικρύνει αρκετά. Δοκίμασε άλλη εικόνα.'));else resolve(data);}catch(error){URL.revokeObjectURL(url);reject(error);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Η εικόνα δεν μπορεί να διαβαστεί σε αυτόν τον browser.'));};img.src=url;});}
async function setWordImage(file,id){const w=getWord(id);if(!w)return;showToast('Η εικόνα ετοιμάζεται…');try{const previous=w.image||'';w.image=await prepareImage(file);if(!save()){w.image=previous;throw Error('Δεν υπάρχει αρκετός χώρος για αυτή την εικόνα. Κράτησε αντίγραφο JSON και αφαίρεσε κάποια παλιά εικόνα.');}modal(infoModal(w));showToast('Η εικόνα αποθηκεύτηκε.');}catch(error){showToast(error?.message||'Η εικόνα δεν αποθηκεύτηκε.');}}
function removeWordImage(id){const w=getWord(id);if(!w||!validImageSource(w.image))return;const previous=w.image;w.image='';if(!save()){w.image=previous;showToast('Η εικόνα δεν αφαιρέθηκε.');return;}modal(infoModal(w));showToast('Η εικόνα αφαιρέθηκε.');}
function parseRows(raw,unit){const errors=[],parsed=[];const lines=String(raw||'').replace(/^\uFEFF/,'').split(/\r?\n/);for(let i=0;i<lines.length;i++){let line=lines[i].trim();if(!line||line.startsWith('#'))continue;let cols;if(line.includes('=')){const k=line.indexOf('=');cols=[line.slice(0,k).trim(),...line.slice(k+1).split('|').map(x=>x.trim())];}else if(line.includes('\t'))cols=line.split('\t').map(x=>x.trim());else if(line.includes(';'))cols=line.split(';').map(x=>x.trim());else if(line.includes(',')){const k=line.indexOf(',');cols=[line.slice(0,k).trim(),line.slice(k+1).trim()];}else{errors.push(i+1);continue;}const [en,el,example='',exampleGr='']=cols;if((/^eng(lish)?$/i.test(en||'')&&/^gr(eek|eek translation)?$/i.test(el||''))||(/^(word|αγγλικά)$/i.test(en||'')&&/^(meaning|ελληνικά)$/i.test(el||'')))continue;if(!en||!el||!/^[a-zA-Z][a-zA-Z '-]{0,70}$/.test(en)){errors.push(i+1);continue;}parsed.push({id:normalize(en),en:en.trim(),el:el.trim(),example:example.trim(),exampleGr:exampleGr.trim(),scene:'',unit:unit||'Προσωπική λίστα'});}return {parsed,errors};}
function importRows(){const raw=document.getElementById('importtext')?.value||'',unit=document.getElementById('importunit')?.value?.trim()||'Προσωπική λίστα';if(!raw.trim()&&!pendingImportPacket){showToast('Γράψε ή φόρτωσε λέξεις πρώτα.');return;}let {parsed,errors}=parseRows(raw,unit);if(pendingImportPacket){parsed=pendingImportPacket.words.filter(w=>w&&typeof w.en==='string'&&typeof w.el==='string'&&/^[a-zA-Z][a-zA-Z '-]{0,70}$/.test(w.en)).map(w=>({id:normalize(w.en),en:w.en.trim(),el:w.el.trim(),example:String(w.example||''),exampleGr:String(w.exampleGr||''),scene:String(w.scene||''),unit:String(w.unit||unit)}));errors=[];}let added=0,updated=0,newStories=0;for(const w of parsed){const ix=db.words.findIndex(x=>normalize(x.en)===normalize(w.en));if(ix>=0){const old=db.words[ix];db.words[ix]={...old,...w,id:old.id,unit:(w.unit==='Προσωπική λίστα'?old.unit:w.unit),scene:w.scene||old.scene};updated++;}else{db.words.push(w);added++;}}if(pendingImportPacket&&Array.isArray(pendingImportPacket.stories)){for(const rawStory of pendingImportPacket.stories){if(!rawStory||typeof rawStory.id!=='string'||typeof rawStory.en!=='string'||!Array.isArray(rawStory.ids))continue;const st={id:String(rawStory.id),name:String(rawStory.name||'Νέα ιστορία'),emoji:String(rawStory.emoji||'📖'),desc:String(rawStory.desc||''),en:String(rawStory.en),el:String(rawStory.el||''),ids:rawStory.ids.map(id=>normalize(id)).filter(id=>db.words.some(w=>w.id===id))};const ix=db.stories.findIndex(x=>x.id===st.id);if(ix>=0)db.stories[ix]=st;else{db.stories.push(st);newStories++;}}}pendingImportPacket=null;save();modal('');render();showToast(`${added} νέες · ${updated} ενημερώθηκαν${newStories?' · '+newStories+' ιστορίες':''}${errors.length?' · '+errors.length+' γραμμές παραλείφθηκαν':''}`);}
function exportFile(filename,content,type){try{const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);showToast('Έτοιμο αρχείο για αποθήκευση.');}catch(e){showToast('Η λήψη αρχείου απέτυχε σε αυτόν τον browser.');}}
function restoreJson(val){try{const json=JSON.parse(val);if(!json||!Array.isArray(json.words)||!Array.isArray(json.stories)||typeof json.progress!=='object')throw Error('format');if(!confirm(`Αντικατάσταση των τωρινών δεδομένων με ${json.words.length} λέξεις;`))return;db=migrateData(json);save();modal('');storyOpen=null;session=null;quiz=null;view='home';screen='subjects';activeSubjectId=null;render();showToast('Το αντίγραφο επαναφέρθηκε.');}catch(e){showToast('Το JSON δεν είναι έγκυρο αντίγραφο της εφαρμογής.');}}
function resetProgress(){if(!confirm('Να διαγραφεί όλη η πρόοδος; Οι λέξεις και οι ιστορίες θα διατηρηθούν.'))return;db.progress={};db.events=[];save();modal('');session=null;quiz=null;render();showToast('Η πρόοδος μηδενίστηκε.');}
function deleteWord(id){const w=getWord(id);if(!w||!confirm(`Να διαγραφεί η λέξη «${w.en}»;`))return;db.words=db.words.filter(x=>x.id!==id);db.stories.forEach(s=>s.ids=s.ids.filter(x=>x!==id));delete db.progress[id];save();wordInfoId=null;modal('');render();showToast('Η λέξη διαγράφηκε.');}
function switchView(v){screen='english';activeSubjectId='english';view=v;wordInfoId=null;storyOpen=null;session=v==='study'?session:null;quiz=v==='test'?quiz:null;storyTranslated=false;modal('');window.scrollTo(0,0);render();}

document.addEventListener('submit',e=>{if(e.target.id==='quizform'){e.preventDefault();quiz.typed=e.target.querySelector('input').value;quizAnswer(quiz.typed);}});
document.addEventListener('input',e=>{if(e.target.id==='wordsearch'){const pos=e.target.selectionStart;searchTerm=e.target.value;const filtered=db.words.filter(w=>(w.en+' '+w.el+' '+w.unit).toLowerCase().includes(searchTerm.toLowerCase())&&(wordFilter==='all'||(wordFilter==='new'&&stat(w).seen===0)||(wordFilter==='learned'&&stat(w).seen>0)||(wordFilter==='due'&&stat(w).seen>0&&stat(w).due<=Date.now())));document.getElementById('wordresults').innerHTML=filtered.length?filtered.map(w=>{const p=stat(w);return `<div class="word-row"><div style="min-width:0;flex:1"><div class="wrd">${esc(w.en)}</div><div class="mean">${esc(w.el)}</div></div><div class="right"><span class="pill ${p.seen?'':'gray'}">${p.seen?'μελετήθηκε':'νέα'}</span><button class="linklike" data-word="${esc(w.id)}">Άνοιγμα</button></div></div>`}).join(''):'<p class="small">Δεν βρέθηκε λέξη.</p>';}if(e.target.id==='typedAnswer'&&quiz){quiz.typed=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-essay-axis]')){captureEssayPlan();save();render();return;}if(e.target.id==='wordimage'&&e.target.files[0]){setWordImage(e.target.files[0],e.target.dataset.imageword);return;}if(e.target.id==='importfile'&&e.target.files[0]){const f=e.target.files[0];f.text().then(raw=>{if(f.name.toLowerCase().endsWith('.json')){try{const j=JSON.parse(raw);if(j.words&&Array.isArray(j.words)){pendingImportPacket={words:j.words,stories:Array.isArray(j.stories)?j.stories:[]};document.getElementById('importtext').value=j.words.map(w=>`${w.en} = ${w.el}${w.example?' | '+w.example:''}${w.exampleGr?' | '+w.exampleGr:''}`).join('\n');showToast(`Φορτώθηκαν ${j.words.length} λέξεις${pendingImportPacket.stories.length?' και '+pendingImportPacket.stories.length+' ιστορίες':''}. Πάτησε Προσθήκη.`);}else throw Error('not words');}catch(err){pendingImportPacket=null;showToast('Μη αναγνωρίσιμο αρχείο JSON.');}}else{pendingImportPacket=null;document.getElementById('importtext').value=raw;showToast('Το αρχείο φορτώθηκε. Πάτησε Προσθήκη.');}});}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){modal('');wordInfoId=null;}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
})();
</script>
</body>
</html>
