function oxygenMoDiagramSvg(){return `<svg viewBox="0 0 360 260" role="img" aria-label="Κατοχή μοριακών τροχιακών του μορίου οξυγόνου">${chemistrySpaceDots()}<line x1="330" y1="228" x2="330" y2="45" stroke="#9ed8e5" stroke-width="2"/><path d="M330 35l-7 13h14z" fill="#ffd76a"/><text x="315" y="39" text-anchor="end" fill="#bdeeff" font-size="9" font-weight="900">E ↑</text><g font-size="10" font-weight="900"><text x="58" y="225" fill="#9ef0de">σ2s</text><text x="58" y="193" fill="#ffb7c4">σ*2s</text><text x="58" y="159" fill="#9ef0de">σ2p</text><text x="58" y="125" fill="#9ef0de">π2p</text><text x="58" y="91" fill="#ffb7c4">π*2p</text><text x="58" y="56" fill="#ffb7c4">σ*2p</text></g><line x1="130" y1="218" x2="257" y2="218" stroke="#5de0c1" stroke-width="4"/><text x="193" y="213" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">↑↓</text><line x1="130" y1="186" x2="257" y2="186" stroke="#e3788c" stroke-width="4"/><text x="193" y="181" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">↑↓</text><line x1="130" y1="152" x2="257" y2="152" stroke="#5de0c1" stroke-width="4"/><text x="193" y="147" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">↑↓</text><line x1="130" y1="118" x2="185" y2="118" stroke="#5de0c1" stroke-width="4"/><line x1="202" y1="118" x2="257" y2="118" stroke="#5de0c1" stroke-width="4"/><text x="157" y="113" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">↑↓</text><text x="229" y="113" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">↑↓</text><line x1="130" y1="84" x2="185" y2="84" stroke="#e3788c" stroke-width="4"/><line x1="202" y1="84" x2="257" y2="84" stroke="#e3788c" stroke-width="4"/><text x="157" y="79" text-anchor="middle" fill="#ffd76a" font-size="15" font-weight="900">↑</text><text x="229" y="79" text-anchor="middle" fill="#ffd76a" font-size="15" font-weight="900">↑</text><line x1="130" y1="50" x2="257" y2="50" stroke="#e3788c" stroke-width="3"/><text x="193" y="250" text-anchor="middle" fill="#ffe598" font-size="10" font-weight="900">2 μονήρη e⁻ στα π*2p → το O₂ είναι παραμαγνητικό</text></svg>`;}
function chemistryMotionControls(){return `<div class="chem-actions"><button class="btn light" data-chem-motion="true">${chemistryPaused?'▶ Συνέχεια':'⏸ Παύση'}</button><button class="btn white" data-chem-replay="true">↻ Επανάληψη animation</button></div>`;}
function chemistryAtomsPage(){const orbitalInfo={
 '1s':{title:'1s · θεμελιώδης κατάσταση',text:'Η χαμηλότερη ενεργειακή κατάσταση. Το νέφος είναι σφαιρικό και η πιθανότητα είναι μεγαλύτερη κοντά στον πυρήνα.'},
 '2s':{title:'2s · διεγερμένη κατάσταση',text:'Με απορρόφηση κατάλληλης ενέργειας το ηλεκτρόνιο μπορεί να βρεθεί στο 2s. Υπάρχει σφαιρικός κόμβος όπου η πιθανότητα μηδενίζεται.'},
 '2p':{title:'2p · διεγερμένη κατάσταση',text:'Το 2p έχει δύο λοβούς και ένα επίπεδο κόμβου στον πυρήνα. Δεν είναι δύο ηλεκτρόνια: παραμένει ένα ηλεκτρόνιο σε διαφορετικό τροχιακό.'},
 'mix':{title:'1s + 2p · κινούμενη υπέρθεση',text:'Η κινούμενη εκδοχή δείχνει ένα αργό εννοιολογικό μοντέλο υπέρθεσης 1s και 2p. Η μεταβολή αφορά την κατανομή πιθανότητας· δεν είναι διαδρομή του ηλεκτρονίου.'}
 }[chemistryOrbital];return `<section class="card chem-intro"><span class="pill">Μικρόκοσμος σε κίνηση</span><h2>Άτομα, ενέργεια και χημικοί δεσμοί</h2><p class="small">Παρατήρησε πώς η ηλεκτρονιακή πυκνότητα και η συνολική ενέργεια εξηγούν τον δεσμό. Τα κινούμενα νέφη είναι εννοιολογικά μοντέλα πιθανότητας και όχι βίντεο πραγματικής τροχιάς.</p><div class="chem-learning-map"><div class="chem-map-step">1<b>Άτομο</b></div><div class="chem-map-step">2<b>Στάθμες</b></div><div class="chem-map-step">3<b>Δεσμός</b></div><div class="chem-map-step">4<b>Ιόν</b></div></div>${chemistryMotionControls()}</section>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">01 · Υδρογόνο H</span><h2>Ένα πρωτόνιο και ένα ηλεκτρόνιο</h2><p>Ο πυρήνας του συνηθισμένου υδρογόνου έχει <b>1 πρωτόνιο</b>. Το νέφος δείχνει πού είναι πιθανότερο να βρεθεί το ένα ηλεκτρόνιο. Οι φωτεινές κουκκίδες του φόντου δεν είναι διαφορετικά ηλεκτρόνια ούτε τροχιές.</p><div class="chem-orbital-buttons">${[{id:'1s',label:'Θεμελιώδης 1s'},{id:'2s',label:'Διεγερμένη 2s'},{id:'2p',label:'Διεγερμένη 2p'},{id:'mix',label:'▶ 1s + 2p'}].map(option=>`<button class="chem-orbital-btn ${chemistryOrbital===option.id?'active':''}" data-chem-orbital="${option.id}">${option.label}</button>`).join('')}</div></div><div class="chem-movie-frame"><span class="chem-movie-label">ΜΟΝΤΕΛΟ ΠΙΘΑΝΟΤΗΤΑΣ</span>${hydrogenOrbitalSvg()}</div><div class="chem-caption"><h3>${orbitalInfo.title}</h3><p>${orbitalInfo.text}</p><div class="chem-equation">H: 1p⁺ + 1e⁻ → συνολικό φορτίο 0</div><div class="chem-model-note"><span>💡</span><span><b>Ένα ηλεκτρόνιο:</b> το νέφος δείχνει πιθανότητα. Οι κουκκίδες δεν είναι διαφορετικά ηλεκτρόνια ούτε τροχιές.</span></div><div class="chem-model-note"><span>🎞️</span><span><b>Κίνηση σε τεράστια επιβράδυνση:</b> επίλεξε «▶ 1s + 2p» για το εννοιολογικό μοντέλο υπέρθεσης. Επίλεξε «Θεμελιώδης 1s» για το σταθερό, σφαιρικό νέφος 1s.</span></div></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">01Β · Ενεργειακές στάθμες</span><h2>Το ηλεκτρόνιο δεν επιλέγει οποιαδήποτε ενέργεια</h2><p>Τα τροχιακά είναι και <b>επιτρεπτές ενεργειακές καταστάσεις</b>. Το 1s είναι χαμηλότερα. Για μετάβαση σε 2s ή 2p απαιτείται απορρόφηση συγκεκριμένου ποσού ενέργειας· για πλήρη απομάκρυνση απαιτείται η ενέργεια ιονισμού.</p></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΔΙΑΓΡΑΜΜΑ ΣΤΑΘΜΩΝ</span>${hydrogenEnergyLevelsSvg()}</div><div class="chem-caption"><div class="chem-story"><div class="chem-story-step"><span class="chem-story-number">1</span><span><b>Χαμηλότερη ενέργεια</b><span>Χωρίς εξωτερική διέγερση το ηλεκτρόνιο βρίσκεται στη θεμελιώδη κατάσταση 1s.</span></span></div><div class="chem-story-step"><span class="chem-story-number">2</span><span><b>Κβαντισμένη μετάβαση</b><span>Απορροφά ακριβώς τη διαφορά ΔE για να ανέβει σε επιτρεπτή στάθμη.</span></span></div><div class="chem-story-step"><span class="chem-story-number">3</span><span><b>Επιστροφή</b><span>Όταν πέφτει σε χαμηλότερη στάθμη, αποδίδει τη διαφορά ενέργειας.</span></span></div></div></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">01Γ · Η ενέργεια του δεσμού</span><h2>Γιατί μοιράζονται ηλεκτρόνια που απωθούνται;</h2><p><b>Η άπωση των δύο ηλεκτρονίων δεν εξαφανίζεται.</b> Ο δεσμός δημιουργείται επειδή μετράει η συνολική ενέργεια όλων των αλληλεπιδράσεων, όχι μόνο μία άπωση.</p></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΜΟΡΙΑΚΑ ΤΡΟΧΙΑΚΑ</span>${hydrogenMoDiagramSvg()}</div><div class="chem-caption"><div class="chem-force-grid"><div class="chem-force attract"><span class="chem-force-symbol">p⁺ ← e⁻ → p⁺</span><b>Έλξη ηλεκτρονίου–πυρήνων</b><span>Κάθε ηλεκτρόνιο έλκεται και από τους δύο θετικούς πυρήνες. Η κοινή πυκνότητα ανάμεσά τους σταθεροποιεί το σύστημα.</span></div><div class="chem-force repel"><span class="chem-force-symbol">e⁻ ↔ e⁻</span><b>Άπωση ηλεκτρονίων</b><span>Τα ομώνυμα φορτία απωθούνται. Η άπωση περιλαμβάνεται πάντα στη συνολική ενέργεια.</span></div><div class="chem-force repel"><span class="chem-force-symbol">p⁺ ↔ p⁺</span><b>Άπωση πυρήνων</b><span>Αν οι πυρήνες πλησιάσουν υπερβολικά, η ενέργεια ανεβαίνει απότομα.</span></div><div class="chem-force attract"><span class="chem-force-symbol">σ1s · ↑↓</span><b>Κοινό δεσμικό τροχιακό</b><span>Τα δύο ηλεκτρόνια έχουν αντίθετο spin και καταλαμβάνουν τη χαμηλότερη δεσμική στάθμη.</span></div></div><div class="chem-energy-summary"><b>Το κριτήριο είναι ένα:</b> στην απόσταση δεσμού το H₂ έχει μικρότερη συνολική ενέργεια από δύο απομονωμένα άτομα H.</div></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΣΥΝΟΛΙΚΗ ΕΝΕΡΓΕΙΑ</span>${hydrogenEnergyCurveSvg()}</div><div class="chem-caption"><div class="chem-key-idea"><b>Κράτησε αυτή την εικόνα:</b> μακριά δεν υπάρχει δεσμός, στη σωστή απόσταση υπάρχει ενεργειακό ελάχιστο, πολύ κοντά κυριαρχούν οι απώσεις. Ο δεσμός δεν σημαίνει ότι τα ηλεκτρόνια έλκονται μεταξύ τους.</div><span class="chem-spin-pair">↑↓ αντίθετο spin · κοινό σ1s</span></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">02 · Μόριο H₂</span><h2>Δύο άτομα μοιράζονται ένα κοινό νέφος</h2><p>Όταν δύο άτομα H πλησιάσουν στη σωστή απόσταση, τα 1s τροχιακά τους συνδυάζονται. Τα δύο ηλεκτρόνια καταλαμβάνουν δεσμικό μοριακό τροχιακό με πυκνότητα ανάμεσα στους πυρήνες.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΠΡΟΣΕΓΓΙΣΗ → ΔΕΣΜΟΣ</span>${hydrogenMoleculeSvg()}</div><div class="chem-caption"><div class="chem-equation">H· + ·H → H:H → H—H</div><p><strong>Γιατί μένουν μαζί;</strong> Η κοινή ηλεκτρονιακή πυκνότητα έλκει και τους δύο θετικούς πυρήνες. Στη σωστή απόσταση η συνολική ενέργεια του H₂ είναι μικρότερη από εκείνη δύο απομονωμένων ατόμων.</p><div class="chem-model-note"><span>🔎</span><span>Οι δύο φωτεινές κουκκίδες είναι μόνο σύμβολα του ηλεκτρονιακού ζεύγους. Το πραγματικό κβαντικό μοντέλο χρησιμοποιεί κατανομή πυκνότητας.</span></div></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">03 · Κατιόν H⁺</span><h2>Τι συμβαίνει όταν χαθεί το ηλεκτρόνιο;</h2><p>Αν δοθεί αρκετή ενέργεια, το ηλεκτρόνιο απομακρύνεται πλήρως. Μένει ο πυρήνας με το ένα πρωτόνιο, οπότε το καθαρό φορτίο είναι θετικό.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΙΟΝΙΣΜΟΣ</span>${hydrogenCationSvg()}</div><div class="chem-caption"><div class="chem-equation">H → H⁺ + e⁻</div><div class="chem-fact-grid"><div class="chem-fact"><b>+1</b><span>φορτίο πρωτονίου</span></div><div class="chem-fact"><b>0</b><span>ηλεκτρόνια που μένουν</span></div></div><p><strong>Άρα:</strong> το «+» δεν είναι νέο σωματίδιο. Είναι το αποτέλεσμα της ανισορροπίας ανάμεσα σε θετικό και αρνητικό φορτίο.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">04 · Μοριακό κατιόν H₂⁺</span><h2>Το μόριο χάνει ένα από τα δύο ηλεκτρόνια</h2><p>Το ουδέτερο H₂ έχει δύο πρωτόνια και δύο ηλεκτρόνια. Αν φύγει ένα ηλεκτρόνιο, απομένει το H₂⁺ με ένα μόνο κοινό ηλεκτρόνιο.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΜΟΡΙΑΚΟΣ ΙΟΝΙΣΜΟΣ</span>${hydrogenMolecularCationSvg()}</div><div class="chem-caption"><div class="chem-equation">H₂ → H₂⁺ + e⁻</div><p>Το H₂⁺ μπορεί να υπάρχει, όμως ο δεσμός του είναι <strong>ασθενέστερος</strong> από τον δεσμό του H₂, επειδή υπάρχει μικρότερη δεσμική ηλεκτρονιακή πυκνότητα.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">05 · Άζωτο N</span><h2>Επτά ηλεκτρόνια σε διαφορετικά τροχιακά</h2><p>Το ουδέτερο άζωτο έχει 7 πρωτόνια και 7 ηλεκτρόνια. Στη θεμελιώδη κατάσταση γράφουμε <b>1s² 2s² 2p³</b>.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΑΠΛΟΠΟΙΗΜΕΝΟ ΝΕΦΟΣ</span>${nitrogenAtomSvg()}</div><div class="chem-caption"><div class="chem-shells"><span class="chem-shell">1η στιβάδα: 2e⁻</span><span class="chem-shell">2η στιβάδα: 5e⁻</span><span class="chem-shell">σθένους: 5e⁻</span></div><p>Τα τρία ηλεκτρόνια στα 2p καταλαμβάνουν αρχικά διαφορετικά p τροχιακά. Αυτά συμμετέχουν έντονα στη χημική συμπεριφορά του αζώτου.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">06 · Μόριο N₂</span><h2>Τρία κοινά ζεύγη: τριπλός δεσμός</h2><p>Κάθε άτομο N χρειάζεται τρία ακόμη ηλεκτρόνια για να συμπληρώσει οκτάδα. Στο N₂ τα δύο άτομα μοιράζονται τρία ζεύγη ηλεκτρονίων.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΤΡΙΠΛΟΣ ΔΕΣΜΟΣ</span>${nitrogenMoleculeSvg()}</div><div class="chem-caption"><div class="chem-equation">:N≡N:</div><p>Ο τριπλός δεσμός είναι πολύ ισχυρός. Γι’ αυτό το N₂ της ατμόσφαιρας είναι σχετικά αδρανές σε συνηθισμένες συνθήκες.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">07 · Οξυγόνο O</span><h2>Οκτώ ηλεκτρόνια — δύο μένουν μονήρη</h2><p>Το ουδέτερο οξυγόνο έχει 8 πρωτόνια και 8 ηλεκτρόνια. Η θεμελιώδης δομή του είναι <b>1s² 2s² 2p⁴</b>: δύο εσωτερικά και έξι ηλεκτρόνια σθένους.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΝΕΦΗ 2p</span>${oxygenAtomSvg()}</div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΚΟΥΤΙΑ ΤΡΟΧΙΑΚΩΝ</span>${oxygenOrbitalBoxesSvg()}</div><div class="chem-caption"><div class="chem-shells"><span class="chem-shell">1η στιβάδα: 2e⁻</span><span class="chem-shell">2η στιβάδα: 6e⁻</span><span class="chem-shell">σθένους: 6e⁻</span></div><div class="chem-key-idea"><b>Κανόνας Hund:</b> τα τρία ισοενεργειακά 2p τροχιακά καταλαμβάνονται πρώτα από ένα ηλεκτρόνιο το καθένα και μετά αρχίζει το ζευγάρωμα. Έτσι στο O υπάρχουν δύο μονήρη ηλεκτρόνια.</div><p>Τα δύο μονήρη ηλεκτρόνια βοηθούν να καταλάβουμε γιατί το οξυγόνο σχηματίζει συχνά δύο ομοιοπολικούς δεσμούς.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">08 · Ιόν οξειδίου O²⁻</span><h2>Δύο επιπλέον ηλεκτρόνια συμπληρώνουν τα 2p</h2><p>Όταν ένα άτομο O προσλάβει δύο ηλεκτρόνια, έχει 10 ηλεκτρόνια αλλά εξακολουθεί να έχει 8 πρωτόνια. Το καθαρό φορτίο γίνεται −2 και η δομή γράφεται <b>1s² 2s² 2p⁶</b>.</p></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΣΥΜΠΛΗΡΩΜΕΝΗ ΟΚΤΑΔΑ</span>${oxygenOrbitalBoxesSvg(true)}</div><div class="chem-caption"><div class="chem-equation">O + 2e⁻ → O²⁻</div><div class="chem-fact-grid"><div class="chem-fact"><b>8p⁺</b><span>θετικά φορτία</span></div><div class="chem-fact"><b>10e⁻</b><span>αρνητικά φορτία</span></div></div><p>Το O²⁻ συναντάται στα ιοντικά στερεά μαζί με κατιόντα. Το «−2» δηλώνει περίσσεια δύο ηλεκτρονίων — όχι αλλαγή του πυρήνα.</p></div></article>
 <article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">09 · Μόριο O₂</span><h2>Διπλός δεσμός, αλλά και δύο μονήρη ηλεκτρόνια</h2><p>Στο απλό μοντέλο Lewis, τα δύο άτομα O μοιράζονται δύο ζεύγη και γράφουμε <b>O=O</b>. Το μοντέλο μοριακών τροχιακών προσθέτει μια σημαντική λεπτομέρεια: δύο ηλεκτρόνια μένουν μονήρη στα αντιδεσμικά π*2p.</p></div><div class="chem-movie-frame"><span class="chem-movie-label">ΜΟΝΤΕΛΟ LEWIS</span>${oxygenMoleculeSvg()}</div><div class="chem-caption"><div class="chem-equation">O· · + · ·O → O=O</div><div class="chem-key-idea"><b>Τι σημαίνει «μονήρες ζεύγος»;</b> Είναι <b>δύο ηλεκτρόνια σθένους που μένουν μαζί στο ίδιο άτομο και δεν μοιράζονται σε δεσμό</b>. «Μονήρες ηλεκτρόνιο» είναι κάτι διαφορετικό: ένα μόνο ηλεκτρόνιο που δεν έχει ταίρι.</div><div class="chem-force-grid"><div class="chem-force repel"><span class="chem-force-symbol">O·</span><b>Μονήρες ηλεκτρόνιο</b><span>Μία τελεία: ένα ηλεκτρόνιο χωρίς ζευγάρι.</span></div><div class="chem-force attract"><span class="chem-force-symbol">O:</span><b>Μονήρες ζεύγος</b><span>Δύο τελείες στο ίδιο O: δύο ηλεκτρόνια που δεν κάνουν δεσμό.</span></div><div class="chem-force attract"><span class="chem-force-symbol">O:O</span><b>Δεσμικό ζεύγος</b><span>Δύο τελείες ανάμεσα στα άτομα: κοινό ζεύγος που τα συνδέει.</span></div></div><p><b>Στο σχήμα Lewis του O₂</b>, κάθε O κρατά δύο μονήρη ζεύγη. Τα δύο κοινά ζεύγη ανάμεσα στα O σχηματίζουν τον διπλό δεσμό O=O.</p></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΜΟΡΙΑΚΑ ΤΡΟΧΙΑΚΑ O₂</span>${oxygenMoDiagramSvg()}</div><div class="chem-caption"><div class="chem-energy-summary"><b>Τάξη δεσμού 2:</b> τα δεσμικά ηλεκτρόνια υπερισχύουν των αντιδεσμικών κατά τέσσερα, άρα (8 − 4) / 2 = 2.</div><div class="chem-key-idea"><b>Γιατί έλκεται από μαγνήτη;</b> Τα δύο μονήρη ηλεκτρόνια στα ισοενεργειακά π*2p κάνουν το O₂ παραμαγνητικό. Αυτό δεν το προβλέπει σωστά μόνο το απλό σχήμα Lewis.</div></div></article>
 <button class="btn primary block" data-chem-view="compounds">Συνέχεια: ενώσεις και νερό →</button><p class="chem-source">Επιστημονική βάση: OpenStax, <a href="https://openstax.org/books/chemistry-2e/pages/6-3-development-of-quantum-theory" target="_blank" rel="noopener">ατομικά τροχιακά</a> και <a href="https://openstax.org/books/chemistry-atoms-first-2e/pages/4-2-covalent-bonding" target="_blank" rel="noopener">ομοιοπολικός δεσμός H₂</a>.</p>`;}
function chemistryCompoundsPage(){return `<section class="card chem-intro"><span class="pill">Ενώσεις & χημικοί δεσμοί</span><h2>Πώς είναι οργανωμένο το μόριο του νερού;</h2><p class="small">Ξεχώρισε τη γεωμετρία των τεσσάρων περιοχών ηλεκτρονιακής πυκνότητας από τη γεωμετρία των τριών πυρήνων. Οι περιοχές έχουν περίπου τετραεδρική διάταξη, αλλά το μόριο H—O—H είναι γωνιακό.</p>${chemistryMotionControls()}</section><article class="card chem-lab"><div class="chem-lab-top"><span class="chem-kicker">H₂O · Πολική ομοιοπολική ένωση</span><h2>Δύο δεσμοί O—H και δύο μονήρη ζεύγη</h2><p>Το O έχει 6 ηλεκτρόνια σθένους και κάθε H έχει 1. Με δύο κοινά ζεύγη, κάθε H «βλέπει» 2 ηλεκτρόνια και το O «βλέπει» 8 γύρω από τη στιβάδα σθένους.</p></div><div class="chem-movie-frame chem-diagram-frame"><span class="chem-movie-label">ΓΕΩΜΕΤΡΙΑ VSEPR</span>${waterFormationSvg()}</div><div class="chem-caption"><div class="chem-equation">Lewis: H—O—H + 2 μονήρη ζεύγη στο O</div><div class="chem-key-idea"><b>Το βασικό ξεχώρισμα:</b> οι τέσσερις περιοχές ηλεκτρονιακής πυκνότητας γύρω από το O κατευθύνονται περίπου τετραεδρικά. Όμως δύο από αυτές είναι μονήρη ζεύγη και δεν έχουν πυρήνα στην άκρη τους. Επομένως οι τρεις πυρήνες H—O—H σχηματίζουν γωνιακό μόριο, όχι ευθύ και όχι τετραεδρικό μόριο τεσσάρων ατόμων.</div><div class="chem-key-idea"><b>Τα δύο μονήρη ζεύγη, απλά:</b> είναι τέσσερα ηλεκτρόνια του O οργανωμένα σε δύο ζευγάρια (2 + 2). Δεν βρίσκονται ανάμεσα στο O και σε ένα H, άρα δεν σχηματίζουν δεσμό. Οι περιοχές τους καταλαμβάνουν περισσότερο χώρο και πιέζουν τους δεσμούς O—H πιο κοντά: έτσι η ιδανική τετραεδρική γωνία 109,5° μειώνεται σε περίπου 104,5°.</div><div class="chem-story"><div class="chem-story-step"><span class="chem-story-number">1</span><span><b>Δομή Lewis</b><span>Σχεδιάζουμε δύο δεσμούς O—H και δύο μονήρη ζεύγη πάνω στο O.</span></span></div><div class="chem-story-step"><span class="chem-story-number">2</span><span><b>Τέσσερις κατευθύνσεις</b><span>Τα τέσσερα ζεύγη ηλεκτρονίων απωθούνται και οργανώνονται περίπου τετραεδρικά γύρω από το O.</span></span></div><div class="chem-story-step"><span class="chem-story-number">3</span><span><b>Σχήμα των πυρήνων</b><span>Μόνο δύο κατευθύνσεις καταλήγουν σε H. Γι’ αυτό η μοριακή γεωμετρία είναι γωνιακή, με H—O—H ≈ 104,5°.</span></span></div></div><div class="chem-warning"><b>Το σχέδιο είναι μοντέλο VSEPR:</b> οι λοβοί δείχνουν περιοχές αυξημένης πιθανότητας να βρεθούν ηλεκτρόνια, όχι σταθερές τροχιές ή συμπαγή αντικείμενα. Η πραγματική ισοσταθμισμένη αντίδραση σχηματισμού είναι 2H₂ + O₂ → 2H₂O· απαιτεί ενέργεια ενεργοποίησης και απελευθερώνει ενέργεια.</div><h3>Γιατί το νερό είναι πολικό;</h3><p>Το O έλκει ισχυρότερα την κοινή ηλεκτρονιακή πυκνότητα. Έτσι η πλευρά του O είναι μερικώς αρνητική (δ−), ενώ οι πλευρές των H μερικώς θετικές (δ+). Επειδή το μόριο είναι γωνιακό, οι πολικότητες δεν αλληλοαναιρούνται.</p><div class="chem-fact-grid"><div class="chem-fact"><b>104,5°</b><span>γωνία H—O—H</span></div><div class="chem-fact"><b>4 περιοχές</b><span>2 δεσμοί + 2 μονήρη ζεύγη</span></div></div></div></article><button class="btn primary block" data-chem-start="true">Έλεγξε τι κατάλαβες →</button><p class="chem-source">Επιστημονική βάση: OpenStax, <a href="https://openstax.org/books/chemistry-2e/pages/7-6-molecular-structure-and-polarity" target="_blank" rel="noopener">δομή και πολικότητα H₂O</a>.</p>`;}
function startChemistryQuiz(){chemistryQuiz={index:0,correct:0,selected:null,marked:false,finished:false};chemistryView='quiz';render();window.scrollTo(0,0);}
function answerChemistryQuestion(index){if(!chemistryQuiz||chemistryQuiz.marked)return;const question=chemistryQuestions[chemistryQuiz.index];chemistryQuiz.selected=Number(index);chemistryQuiz.marked=true;if(chemistryQuiz.selected===question.answer)chemistryQuiz.correct++;render();}
function finishChemistryQuiz(){if(!chemistryQuiz||chemistryQuiz.finished)return;chemistryQuiz.finished=true;const score=Math.round(chemistryQuiz.correct/chemistryQuestions.length*100);db.chemistry.lastScore=score;db.chemistry.bestScore=Math.max(db.chemistry.bestScore,score);db.chemistry.attempts++;save();render();window.scrollTo(0,0);}
function nextChemistryQuestion(){if(!chemistryQuiz)return;if(chemistryQuiz.index+1>=chemistryQuestions.length){finishChemistryQuiz();return;}chemistryQuiz.index++;chemistryQuiz.selected=null;chemistryQuiz.marked=false;render();window.scrollTo(0,0);}
function resetChemistryQuiz(){if(chemistryQuiz&&!confirm('Να ξεκινήσει ξανά το τεστ Χημείας από την αρχή;'))return;startChemistryQuiz();showToast('Το τεστ Χημείας ξεκίνησε από την αρχή.');}
function chemistryQuizPage(){if(!chemistryQuiz)return `<section class="card chem-intro"><span class="pill">${chemistryQuestions.length} ερωτήσεις</span><h2>Έλεγχος κατανόησης</h2><p class="small">Έλεγξε αν ξεχωρίζεις άτομο, ενεργειακή στάθμη, μόριο και ιόν και αν μπορείς να εξηγήσεις γιατί ο ομοιοπολικός δεσμός μειώνει τη συνολική ενέργεια.</p>${db.chemistry.attempts?`<div class="grid3" style="margin-top:15px"><div class="stat"><b>${db.chemistry.lastScore}</b><span>Τελευταίο</span></div><div class="stat"><b>${db.chemistry.bestScore}</b><span>Καλύτερο</span></div><div class="stat"><b>${db.chemistry.attempts}</b><span>Προσπάθειες</span></div></div>`:''}<button class="btn primary block" style="margin-top:15px" data-chem-start="true">Έναρξη τεστ</button></section>`;if(chemistryQuiz.finished){const score=Math.round(chemistryQuiz.correct/chemistryQuestions.length*100);return `<div class="study-end"><div class="score-ring"><b>${score}</b><span>/ 100</span></div><h2>${studyGrade(score)}</h2><p class="small">${chemistryQuiz.correct} σωστές απαντήσεις στις ${chemistryQuestions.length}.</p><p class="history-score">Καλύτερη επίδοση: ${db.chemistry.bestScore}/100 · ${db.chemistry.attempts} ${db.chemistry.attempts===1?'προσπάθεια':'προσπάθειες'}</p></div><div class="vstack" style="margin-top:15px"><button class="btn light block" data-chem-reset="true">↻ Επανάληψη τεστ</button><button class="btn white block" data-chem-view="atoms">Επιστροφή στα μοντέλα</button></div>`;}const question=chemistryQuestions[chemistryQuiz.index],correct=chemistryQuiz.selected===question.answer;return `<div class="between"><span class="pill gray">Ερώτηση ${chemistryQuiz.index+1} / ${chemistryQuestions.length}</span><span class="small">${chemistryQuiz.correct} σωστές</span></div><div class="lesson-progress"><span style="width:${chemistryQuiz.index/chemistryQuestions.length*100}%"></span></div><div class="card"><div class="chem-kicker">Χημεία · κατανόηση</div><div class="chem-quiz-question">${esc(question.q)}</div>${question.options.map((option,index)=>`<button class="choice ${chemistryQuiz.marked?(index===question.answer?'correct':index===chemistryQuiz.selected?'wrong':''):''}" data-chem-answer="${index}" ${chemistryQuiz.marked?'disabled':''}>${esc(option)}</button>`).join('')}${chemistryQuiz.marked?`<div class="history-explain"><b>${correct?'✓ Σωστά':'✗ Χρειάζεται διόρθωση'}</b><br>${esc(question.explain)}</div><button class="btn primary block" data-chem-next="true">${chemistryQuiz.index+1<chemistryQuestions.length?'Επόμενη ερώτηση →':'Δες τη βαθμολογία'}</button>`:''}</div><button class="btn light block" data-chem-reset="true">↻ Reset τεστ</button>`;}
function chemistryModule(){const subject=subjectById('chemistry')||chemistrySubject(),content=chemistryView==='compounds'?chemistryCompoundsPage():chemistryView==='quiz'?chemistryQuizPage():chemistryAtomsPage();return `<header class="subject-head chem-head"><button class="subject-back" data-subjects="true">← Όλα τα μαθήματα</button><div class="subject-head-main"><span class="subject-icon">${esc(subject.emoji)}</span><div><h1>${esc(subject.name)}</h1><p>${esc(subject.description)}</p></div></div></header><main class="main chemistry ${chemistryPaused?'chemistry-paused':''}"><div class="chem-tabs"><button data-chem-view="atoms" class="${chemistryView==='atoms'?'active':''}">⚛️ Άτομα & ιόντα</button><button data-chem-view="compounds" class="${chemistryView==='compounds'?'active':''}">💧 Ενώσεις</button><button data-chem-view="quiz" class="${chemistryView==='quiz'?'active':''}">✅ Quiz</button></div>${content}</main>`;}
function replayChemistryAnimation(){render();showToast('Το animation ξεκίνησε ξανά.');}

function isIosDevice(){return /iphone|ipad|ipod/i.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}

function installHelpModal(){return `<div class="overlay" data-overlay="true"><section role="dialog" aria-modal="true" aria-label="Πλήρης οθόνη στο iPhone" class="sheet"><div class="between"><h3>Πλήρης οθόνη στο iPhone</h3><button class="btn sm light" data-closemodal="true">✕</button></div><p class="small">Οι σκούρες περιοχές της φωτογραφίας είναι οι μπάρες του Chrome/Viber. Αφαιρούνται όταν ανοίξεις την εφαρμογή από το εικονίδιό της.</p><div class="install-steps"><div class="install-step"><span class="install-step-number">1</span><span><b>Άνοιξε το site στο Safari</b><span>Χρησιμοποίησε τη διεύθυνση 123jolio.github.io/lexistories-study-app/.</span></span></div><div class="install-step"><span class="install-step-number">2</span><span><b>Πάτησε Κοινοποίηση</b><span>Το τετράγωνο με το βέλος προς τα πάνω.</span></span></div><div class="install-step"><span class="install-step-number">3</span><span><b>Προσθήκη στην Αρχική οθόνη</b><span>Ενεργοποίησε «Άνοιγμα ως εφαρμογή ιστού» και πάτησε Προσθήκη.</span></span></div><div class="install-step"><span class="install-step-number">4</span><span><b>Άνοιξε το νέο εικονίδιο</b><span>Η εφαρμογή θα γεμίσει την οθόνη χωρίς τις πάνω και κάτω μπάρες του browser.</span></span></div></div><div class="install-note">Σημαντικό: αν την ανοίγεις ξανά από Viber ή Chrome, οι μπάρες θα εμφανίζονται. Άνοιγέ την από το εικονίδιο «Μαθήματα» στην Αρχική οθόνη.</div><button class="btn primary block" style="margin-top:15px" data-closemodal="true">Το κατάλαβα</button></section></div>`;}
function subjectsHome(){
 const english=subjectById('english'),history=subjectById('history'),essay=subjectById('essay');
 const hour=new Date().getHours(),greeting=hour<12?'Καλημέρα ☀️':hour<18?'Καλησπέρα ✨':'Ήρεμη μελέτη 🌙';
 const day=uniqueToday(),goal=Math.max(1,db.goal),progress=Math.min(100,Math.round(day*100/goal)),learned=learnedCount();
 const bestScore=Math.max(Number(db.grammar.bestScore)||0,Number(db.finalTest3.bestScore)||0,Number(db.history.bestScore)||0,Number(db.chemistry.bestScore)||0);
 const dailyTitle=day>=goal?'Το σημερινό σου goal ολοκληρώθηκε!':day?'Έχεις ήδη πάρει φόρα σήμερα':'Το πρώτο μικρό βήμα σε περιμένει';
 const customSubjects=db.subjects.filter(subject=>!['english','history','chemistry','essay'].includes(subject.id));

function showToast(message){document.getElementById('toaster').innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toaster').innerHTML='',3200);}
function speak(value){if(!window.speechSynthesis){showToast('Η εκφώνηση δεν υποστηρίζεται σε αυτόν τον browser.');return;}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(value);utterance.lang='en-GB';utterance.rate=.83;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance);}
function prepareImage(file){return new Promise((resolve,reject)=>{if(!file||!String(file.type).startsWith('image/')){reject(Error('Επίλεξε αρχείο εικόνας.'));return;}if(file.size>12*1024*1024){reject(Error('Η εικόνα είναι πολύ μεγάλη. Επίλεξε αρχείο έως 12 MB.'));return;}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const maxSide=520,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const context=canvas.getContext('2d');context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(img,0,0,canvas.width,canvas.height);let quality=.78,data='';do{data=canvas.toDataURL('image/jpeg',quality);quality-=.1;}while(data.length>280000&&quality>=.38);URL.revokeObjectURL(url);if(data.length>320000)reject(Error('Η εικόνα δεν μπόρεσε να μικρύνει αρκετά. Δοκίμασε άλλη εικόνα.'));else resolve(data);}catch(error){URL.revokeObjectURL(url);reject(error);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Η εικόνα δεν μπορεί να διαβαστεί σε αυτόν τον browser.'));};img.src=url;});}
async function setWordImage(file,id){const w=getWord(id);if(!w)return;showToast('Η εικόνα ετοιμάζεται…');try{const previous=w.image||'';w.image=await prepareImage(file);if(!save()){w.image=previous;throw Error('Δεν υπάρχει αρκετός χώρος για αυτή την εικόνα. Κράτησε αντίγραφο JSON και αφαίρεσε κάποια παλιά εικόνα.');}modal(infoModal(w));showToast('Η εικόνα αποθηκεύτηκε.');}catch(error){showToast(error?.message||'Η εικόνα δεν αποθηκεύτηκε.');}}
function removeWordImage(id){const w=getWord(id);if(!w||!validImageSource(w.image))return;const previous=w.image;w.image='';if(!save()){w.image=previous;showToast('Η εικόνα δεν αφαιρέθηκε.');return;}modal(infoModal(w));showToast('Η εικόνα αφαιρέθηκε.');}
function parseRows(raw,unit){const errors=[],parsed=[];const lines=String(raw||'').replace(/^\uFEFF/,'').split(/\r?\n/);for(let i=0;i<lines.length;i++){let line=lines[i].trim();if(!line||line.startsWith('#'))continue;let cols;if(line.includes('=')){const k=line.indexOf('=');cols=[line.slice(0,k).trim(),...line.slice(k+1).split('|').map(x=>x.trim())];}else if(line.includes('\t'))cols=line.split('\t').map(x=>x.trim());else if(line.includes(';'))cols=line.split(';').map(x=>x.trim());else if(line.includes(',')){const k=line.indexOf(',');cols=[line.slice(0,k).trim(),line.slice(k+1).trim()];}else{errors.push(i+1);continue;}const [en,el,example='',exampleGr='']=cols;if((/^eng(lish)?$/i.test(en||'')&&/^gr(eek|eek translation)?$/i.test(el||''))||(/^(word|αγγλικά)$/i.test(en||'')&&/^(meaning|ελληνικά)$/i.test(el||'')))continue;if(!en||!el||!/^[a-zA-Z][a-zA-Z '-]{0,70}$/.test(en)){errors.push(i+1);continue;}parsed.push({id:normalize(en),en:en.trim(),el:el.trim(),example:example.trim(),exampleGr:exampleGr.trim(),scene:'',unit:unit||'Προσωπική λίστα'});}return {parsed,errors};}
function importRows(){const raw=document.getElementById('importtext')?.value||'',unit=document.getElementById('importunit')?.value?.trim()||'Προσωπική λίστα';if(!raw.trim()&&!pendingImportPacket){showToast('Γράψε ή φόρτωσε λέξεις πρώτα.');return;}let {parsed,errors}=parseRows(raw,unit);if(pendingImportPacket){parsed=pendingImportPacket.words.filter(w=>w&&typeof w.en==='string'&&typeof w.el==='string'&&/^[a-zA-Z][a-zA-Z '-]{0,70}$/.test(w.en)).map(w=>({id:normalize(w.en),en:w.en.trim(),el:w.el.trim(),example:String(w.example||''),exampleGr:String(w.exampleGr||''),scene:String(w.scene||''),unit:String(w.unit||unit)}));errors=[];}let added=0,updated=0,newStories=0;for(const w of parsed){const ix=db.words.findIndex(x=>normalize(x.en)===normalize(w.en));if(ix>=0){const old=db.words[ix];db.words[ix]={...old,...w,id:old.id,unit:(w.unit==='Προσωπική λίστα'?old.unit:w.unit),scene:w.scene||old.scene};updated++;}else{db.words.push(w);added++;}}if(pendingImportPacket&&Array.isArray(pendingImportPacket.stories)){for(const rawStory of pendingImportPacket.stories){if(!rawStory||typeof rawStory.id!=='string'||typeof rawStory.en!=='string'||!Array.isArray(rawStory.ids))continue;const st={id:String(rawStory.id),name:String(rawStory.name||'Νέα ιστορία'),emoji:String(rawStory.emoji||'📖'),desc:String(rawStory.desc||''),en:String(rawStory.en),el:String(rawStory.el||''),ids:rawStory.ids.map(id=>normalize(id)).filter(id=>db.words.some(w=>w.id===id))};const ix=db.stories.findIndex(x=>x.id===st.id);if(ix>=0)db.stories[ix]=st;else{db.stories.push(st);newStories++;}}}pendingImportPacket=null;save();modal('');render();showToast(`${added} νέες · ${updated} ενημερώθηκαν${newStories?' · '+newStories+' ιστορίες':''}${errors.length?' · '+errors.length+' γραμμές παραλείφθηκαν':''}`);}
function exportFile(filename,content,type){try{const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);showToast('Έτοιμο αρχείο για αποθήκευση.');}catch(e){showToast('Η λήψη αρχείου απέτυχε σε αυτόν τον browser.');}}
function restoreJson(val){try{const json=JSON.parse(val);if(!json||!Array.isArray(json.words)||!Array.isArray(json.stories)||typeof json.progress!=='object')throw Error('format');if(!confirm(`Αντικατάσταση των τωρινών δεδομένων με ${json.words.length} λέξεις;`))return;db=migrateData(json);save();modal('');storyOpen=null;session=null;quiz=null;view='home';screen='subjects';activeSubjectId=null;render();showToast('Το αντίγραφο επαναφέρθηκε.');}catch(e){showToast('Το JSON δεν είναι έγκυρο αντίγραφο της εφαρμογής.');}}
function resetProgress(){if(!confirm('Να διαγραφεί όλη η πρόοδος; Οι λέξεις και οι ιστορίες θα διατηρηθούν.'))return;db.progress={};db.events=[];save();modal('');session=null;quiz=null;render();showToast('Η πρόοδος μηδενίστηκε.');}
function deleteWord(id){const w=getWord(id);if(!w||!confirm(`Να διαγραφεί η λέξη «${w.en}»;`))return;db.words=db.words.filter(x=>x.id!==id);db.stories.forEach(s=>s.ids=s.ids.filter(x=>x!==id));delete db.progress[id];save();wordInfoId=null;modal('');render();showToast('Η λέξη διαγράφηκε.');}
function switchView(v){screen='english';activeSubjectId='english';view=v;wordInfoId=null;storyOpen=null;session=v==='study'?session:null;quiz=v==='test'?quiz:null;storyTranslated=false;modal('');window.scrollTo(0,0);render();}

document.addEventListener('submit',e=>{if(e.target.id==='quizform'){e.preventDefault();quiz.typed=e.target.querySelector('input').value;quizAnswer(quiz.typed);}});
document.addEventListener('input',e=>{if(e.target.id==='wordsearch'){const pos=e.target.selectionStart;searchTerm=e.target.value;const filtered=db.words.filter(w=>(w.en+' '+w.el+' '+w.unit).toLowerCase().includes(searchTerm.toLowerCase())&&(wordFilter==='all'||(wordFilter==='new'&&stat(w).seen===0)||(wordFilter==='learned'&&stat(w).seen>0)||(wordFilter==='due'&&stat(w).seen>0&&stat(w).due<=Date.now())));document.getElementById('wordresults').innerHTML=filtered.length?filtered.map(w=>{const p=stat(w);return `<div class="word-row"><div style="min-width:0;flex:1"><div class="wrd">${esc(w.en)}</div><div class="mean">${esc(w.el)}</div></div><div class="right"><span class="pill ${p.seen?'':'gray'}">${p.seen?'μελετήθηκε':'νέα'}</span><button class="linklike" data-word="${esc(w.id)}">Άνοιγμα</button></div></div>`}).join(''):'<p class="small">Δεν βρέθηκε λέξη.</p>';}if(e.target.id==='typedAnswer'&&quiz){quiz.typed=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-essay-axis]')){captureEssayPlan();save();render();return;}if(e.target.id==='wordimage'&&e.target.files[0]){setWordImage(e.target.files[0],e.target.dataset.imageword);return;}if(e.target.id==='importfile'&&e.target.files[0]){const f=e.target.files[0];f.text().then(raw=>{if(f.name.toLowerCase().endsWith('.json')){try{const j=JSON.parse(raw);if(j.words&&Array.isArray(j.words)){pendingImportPacket={words:j.words,stories:Array.isArray(j.stories)?j.stories:[]};document.getElementById('importtext').value=j.words.map(w=>`${w.en} = ${w.el}${w.example?' | '+w.example:''}${w.exampleGr?' | '+w.exampleGr:''}`).join('\n');showToast(`Φορτώθηκαν ${j.words.length} λέξεις${pendingImportPacket.stories.length?' και '+pendingImportPacket.stories.length+' ιστορίες':''}. Πάτησε Προσθήκη.`);}else throw Error('not words');}catch(err){pendingImportPacket=null;showToast('Μη αναγνωρίσιμο αρχείο JSON.');}}else{pendingImportPacket=null;document.getElementById('importtext').value=raw;showToast('Το αρχείο φορτώθηκε. Πάτησε Προσθήκη.');}});}});
