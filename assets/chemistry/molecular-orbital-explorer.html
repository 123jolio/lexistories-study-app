:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  -webkit-font-smoothing: antialiased;
  font-size: var(--font-size-base);
  line-height: calc(var(--font-size-base) * 1.625);
  font-weight: var(--font-weight-normal);
}

:root:not([data-app-block-surface], [data-visualize-standalone]) > body {
  padding: 12px;
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
  text-underline-offset: 2px;
  font-weight: inherit;
}

a:is(:hover, :focus-visible) {

}

h1,
h2,
h3,
h4,
h5,
h6,

}
p,
h1,
h2,
h3,
h4,
h5,

.table {

}

h1 {

}

h2 {
  font-size: calc(var(--font-size-base) * 1.25);

}
h3 {

}
h4 {

}
h5,
h6 {

  line-height: calc(var(--font-size-base) * 1.625);
}

h1,
h2,
h3,
h4,
h5,
h6,
b,

}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}
pre,
pre code {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 20px;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget > :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

/* The shared runtime owns data-tooltip; suppress AppBlock's pseudo-tooltip. */
main [data-tooltip]::after {
  content: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {

}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;

  max-inline-size: 100%;
  align-items: center;
  justify-content: center;

  margin: 0;

  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

.btn:is(.btn-block, .viz-tile) {

}

.btn.viz-tile {
  min-width: 0;

}

a.btn {
  cursor: var(--cursor-interaction, pointer);

.btn:not(:disabled):hover {

    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );

.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);

.btn-ghost:not(:disabled):hover {

  background: light-dark(

.nav-pills .nav-link {

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );

  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(> .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel > [data-variant][hidden] {
  display: none !important;
}

.viz-carousel > [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)

  z-index: 2;
  bottom: 8px;
  left: 50%;

  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */

  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker > summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls > button,
.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {

    return [scene.cx+a*scene.scale*p,scene.cy-c*scene.scale*p,p];
  }
  function line3D(pts,color,alpha=.5,lw=1){ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.globalAlpha=alpha;ctx.beginPath();pts.forEach((p,i)=>{const a=project(...p);if(i)ctx.lineTo(a[0],a[1]);else ctx.moveTo(a[0],a[1]);});ctx.stroke();ctx.globalAlpha=1;}
  function phaseIndex(re,im){let p=Math.atan2(im,re);if(p<0)p+=Math.PI*2;return Math.floor(p/(Math.PI*2)*24)%24;}
  function drawCloud(points,stride,monochrome=false,factor=1){
    const a=Math.sqrt(1-weight),b=Math.sqrt(weight),cp=Math.cos(phase),sp=Math.sin(phase),sizeBase=scene.small?3.3:4.8;
    for(let i=0;i<points.length;i+=stride){
      const x=points[i]/500,y=points[i+1]/500,z=points[i+2]/500;if(Math.hypot(x,y,z)>scene.extent*1.5)continue;
      let opacity=1,color=0;
      if(model.kind==='mix'){
        const p=points[i+4]/10000,q=points[i+5]/10000,re=a*p+b*q*cp,im=-b*q*sp;opacity=2*(re*re+im*im);if(!monochrome)color=phaseIndex(re,im);
      }else if(!monochrome&&stride===4)color=points[i+3]<0?12:0;
      const p=project(x,y,z),sz=sizeBase*p[2];ctx.globalAlpha=Math.min(1,.38*factor*opacity);ctx.drawImage(sprites[color],p[0]-sz/2,p[1]-sz/2,sz,sz);
    }ctx.globalAlpha=1;
  }
  function nuclei(){
    for(const n of model.nuclei){const p=project(n[1],n[2],n[3]);ctx.fillStyle=textColor;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(p[0],p[1],scene.small?2:3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      if(!scene.small){ctx.font='500 '+fontSize+'px '+font;ctx.fillText(n[0],p[0]+6,p[1]-6);}
    }
  }
  function eigen(x,y,z,state){const r=Math.hypot(x,y,z);if(state==='h1s')return Math.exp(-r)/Math.sqrt(Math.PI);if(state==='h2s')return (2-r)*Math.exp(-r/2)/(4*Math.sqrt(2*Math.PI));if(state==='h2p')return z*Math.exp(-r/2)/(4*Math.sqrt(2*Math.PI));return (3*z*z-r*r)*Math.exp(-r/3)/(81*Math.sqrt(6*Math.PI));}
  function waveParts(x,z){if(model.kind==='mix'){const a=Math.sqrt(1-weight)*eigen(x,0,z,'h2p'),b=Math.sqrt(weight)*eigen(x,0,z,'h3d');return [a+b*Math.cos(phase),-b*Math.sin(phase)];}return [eigen(x,0,z,key),0];}
  function waveSurface(o){
    const molecular=!!o,n=molecular?o.sliceN:49,extent=molecular?o.sliceExtent:(key==='h1s'?3.5:model.extent*.83),verts=[],values=[];
    const norm=molecular?1:key==='mix'?.085:key==='h1s'?1/Math.sqrt(Math.PI):key==='h2s'?.1995:key==='h2p'?.0734:.0205;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=(i/(n-1)*2-1)*extent,z=(j/(n-1)*2-1)*extent,v=molecular?[o._slice[j*n+i]/10000,0]:waveParts(x,z);values.push(v);verts.push([x,v[0]/norm*scene.extent*.55,z]);}
    for(let j=0;j<n;j+=2)for(let i=0;i<n-1;i++){const k=j*n+i;line3D([verts[k],verts[k+1]],colors[Math.floor(phaseIndex(...values[k])/6)],.8,.9);}
    for(let i=0;i<n;i+=2)for(let j=0;j<n-1;j++){const k=j*n+i;line3D([verts[k],verts[k+n]],colors[Math.floor(phaseIndex(...values[k])/6)],.4,.7);}
    line3D([[-extent,0,-extent],[extent,0,-extent],[extent,0,extent],[-extent,0,extent],[-extent,0,-extent]],mutedColor,.3,.7);
  }
  function nodeGeometry(){
    if(!nodes.checked||model.kind!=='hydrogen')return;
    if(key==='h2s')for(let axis=0;axis<3;axis++){const c=[];for(let i=0;i<=64;i++){const t=i/64*Math.PI*2,a=2*Math.cos(t),b=2*Math.sin(t);c.push(axis===0?[a,b,0]:axis===1?[a,0,b]:[0,a,b]);}line3D(c,mutedColor,.65,.8);}
    if(key==='h2p')for(let i=-6;i<=6;i+=3){line3D([[i,-6,0],[i,6,0]],mutedColor,.25);line3D([[-6,i,0],[6,i,0]],mutedColor,.25);}
    if(key==='h3d')for(const sign of [-1,1])for(const h of [3,6,9]){const c=[];for(let i=0;i<=48;i++){const t=i/48*Math.PI*2;c.push([h*Math.SQRT2*Math.cos(t),h*Math.SQRT2*Math.sin(t),sign*h]);}line3D(c,mutedColor,.25,.8);}
  }
  function currentArrows(){
    if(!flow.checked||model.kind!=='mix')return;
    const factor=Math.sqrt(weight*(1-weight))*Math.sin(phase);if(Math.abs(factor)<1e-5)return;
    let count=0;
    for(let x=-12;x<=12;x+=3)for(let z=-12;z<=12;z+=3){
      const p=eigen(x,0,z,'h2p'),d=eigen(x,0,z,'h3d'),step=.01;
      const px=(eigen(x+step,0,z,'h2p')-eigen(x-step,0,z,'h2p'))/(2*step),pz=(eigen(x,0,z+step,'h2p')-eigen(x,0,z-step,'h2p'))/(2*step);
      const dx=(eigen(x+step,0,z,'h3d')-eigen(x-step,0,z,'h3d'))/(2*step),dz=(eigen(x,0,z+step,'h3d')-eigen(x,0,z-step,'h3d'))/(2*step);
      const vx=factor*(d*px-p*dx),vz=factor*(d*pz-p*dz),mag=Math.hypot(vx,vz);if(mag<.000002)continue;
      const length=1.7*Math.min(1,mag/.000025),a=project(x,0,z),b=project(x+vx/mag*length,0,z+vz/mag*length),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
      ctx.strokeStyle=textColor;ctx.globalAlpha=.7;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.moveTo(b[0]-4*Math.cos(ang-.5),b[1]-4*Math.sin(ang-.5));ctx.lineTo(b[0],b[1]);ctx.lineTo(b[0]-4*Math.cos(ang+.5),b[1]-4*Math.sin(ang+.5));ctx.stroke();count++;
    }ctx.globalAlpha=1;canvas.dataset.arrows=String(count);
  }
  function scaleMark(){
    const a=scene.extent>10?5:scene.extent>5?2:scene.extent<1?.2:1,x=scene.box.x+10,y=scene.box.y+scene.box.h-14;
    ctx.strokeStyle=mutedColor;ctx.globalAlpha=.8;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+a*scene.scale,y);ctx.stroke();ctx.fillStyle=mutedColor;ctx.font=Math.max(11,fontSize*.857)+'px '+font;ctx.fillText(String(a).replace('.',',')+' a₀',x,y-6);ctx.globalAlpha=1;
  }
  function renderScene(box,o,type,small=false){
    let extent=o?o.extent:model.extent;if(type==='wave'&&o)extent=o.sliceExtent*1.25;
    scene={box,extent,small,cx:box.x+box.w/2,cy:box.y+box.h/2,scale:Math.min(box.w,box.h)*.43/extent};
    ctx.save();ctx.beginPath();ctx.rect(box.x,box.y,box.w,box.h);ctx.clip();
    if(type==='wave'&&model.kind!=='empty')waveSurface(o);
    else {
      if(model.kind==='molecule'){
        if(type==='density')drawCloud(model._points,3,true);
        else if(type==='sum'){for(const i of chosen){const o=model.orbitals[i],factor=o.occ/model.electrons*(model._points.length/3)/(o._points.length/4);drawCloud(o._points,4,true,factor);}}
        else drawCloud(o._points,4);
      }else if(model._points)drawCloud(model._points,model.kind==='mix'?6:4,type==='density');
      nodeGeometry();nuclei();currentArrows();
    }
    scaleMark();ctx.restore();
  }
  function draw(){
    if(!sprites.length||!width)return;
    ctx.clearRect(0,0,width,height);ctx.textAlign='left';canvas.dataset.arrows='0';panels=[];
    if(mode==='gallery'&&model.orbitals){
      const list=model.orbitals.map((o,i)=>({o,i})).filter(v=>v.o.occ||virtual.checked);list.push({o:null,i:-1});
      const cols=width>=620?3:2,rows=Math.ceil(list.length/cols),cw=width/cols,ch=height/rows;
      list.forEach(({o,i},j)=>{
        const x=j%cols*cw,y=Math.floor(j/cols)*ch;
        ctx.fillStyle=textColor;ctx.font='500 '+fontSize+'px '+font;ctx.fillText(o?pretty(o.label)+' · '+o.occ+' e⁻':'Συνολική · '+model.electrons+' e⁻',x+10,y+20);
        ctx.fillStyle=mutedColor;ctx.font=Math.max(11,fontSize*.857)+'px '+font;ctx.fillText(o?num(o.energy)+' eV'+(o.occ===0?' · κενό':''):'Όλα τα κατειλημμένα',x+10,y+39);
        const box={x:x+3,y:y+46,w:cw-6,h:ch-48};renderScene(box,o,o?'orbital':'density',true);panels.push({x,y,w:cw,h:ch,index:i});
      });
    }else renderScene({x:0,y:0,w:width,h:height},model.orbitals?model.orbitals[orbitalIndex]:null,mode);
    canvas.dataset.state=key;canvas.dataset.mode=mode;canvas.dataset.orbital=String(orbitalIndex);canvas.dataset.phase=phase.toFixed(4);
    canvas.dataset.panels=String(panels.length);canvas.dataset.selectedElectrons=String(model.orbitals?[...chosen].reduce((s,i)=>s+model.orbitals[i].occ,0):model.electrons);
  }
  function animate(now){
    if(!root.isConnected)return;
    const dt=previous?Math.min((now-previous)/1000,.05):0;previous=now;
    if(running&&!document.hidden&&!drag){if(turn.checked)yaw+=dt*.16;if(model.kind==='mix')phase=(phase+dt*Math.PI/3)%(2*Math.PI);}
    if(now-lastDraw>50){draw();lastDraw=now;}
    if(model.kind==='mix'&&now-lastClock>150){phaseSlider.value=String(Math.round(phase*1000));el('phase-value').textContent=num(phase)+' rad';el('clock').textContent=num(phase/(2*Math.PI)*model.periodFs)+' fs';lastClock=now;}
    requestAnimationFrame(animate);
  }
  species.addEventListener('change',()=>{key=species.value;model=DATA[key];mode=model.kind==='molecule'?'gallery':'orbital';phase=0;virtual.checked=false;setup(true);});
  view.addEventListener('change',()=>{mode=view.value;setup();});
  orbitalSelect.addEventListener('change',()=>{orbitalIndex=Number(orbitalSelect.value);updateStatus();draw();});
  virtual.addEventListener('change',()=>{updateStatus();resize();});
  play.addEventListener('click',()=>{running=!running;play.textContent=running?'Παύση':'Συνέχεια';draw();});
  turn.addEventListener('change',draw);nodes.addEventListener('change',draw);flow.addEventListener('change',()=>{updateLegend();draw();});
  phaseSlider.addEventListener('input',()=>{phase=Number(phaseSlider.value)/1000;running=false;play.textContent='Συνέχεια';el('phase-value').textContent=num(phase)+' rad';el('clock').textContent=num(phase/(2*Math.PI)*model.periodFs)+' fs';draw();});
  weightSlider.addEventListener('input',()=>{weight=Number(weightSlider.value)/100;el('weight-value').textContent=String(Math.round(weight*100))+'%';draw();});
  canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;yaw+=dx*.008;pitch=Math.max(-1.1,Math.min(1.1,pitch+dy*.008));drag.x=e.clientX;drag.y=e.clientY;draw();});
  canvas.addEventListener('pointerup',e=>{
    if(drag&&!drag.moved&&mode==='gallery'){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=panels.find(v=>x>=v.x&&x<v.x+v.w&&y>=v.y&&y<v.y+v.h);if(p){if(p.index<0)mode='density';else{orbitalIndex=p.index;orbitalSelect.value=String(orbitalIndex);mode='orbital';}setup();}}
    drag=null;
  });canvas.addEventListener('pointercancel',()=>{drag=null;});
  new ResizeObserver(resize).observe(canvas);
  new MutationObserver(()=>palette()).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  hydrate();fillOrbitals();palette();setup();play.textContent=running?'Παύση':'Συνέχεια';requestAnimationFrame(animate);
})();
</script>
